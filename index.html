<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>La mia libreria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#1c1712; --ink:#f3ead8; --muted:#b5a487; --line:#4a3d2e; --field:#2a221a;
  --accent:#d9a65a;
  --row:200px; --plank:16px; --s:1;
}
@media (max-width:640px){ :root{ --row:160px; --plank:13px; --s:.8; } }
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% -20%, #3b2e21 0%, transparent 60%), var(--wall);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
header{max-width:1100px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 6px calc(20px + env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(32px,7vw,46px);margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#2a1d0f;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #5d4c39}
.btn.danger{background:#9e3a2e;color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.controls{max-width:1100px;margin:0 auto;padding:14px 20px 6px;display:flex;gap:10px;flex-wrap:wrap}
.field{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font:15px Inter,sans-serif;outline:none;width:100%}
.field:focus{border-color:var(--accent)}
.controls .search{flex:1 1 240px;position:relative}
.controls .search input{padding-left:38px}
.controls .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
.controls select{flex:0 1 230px}
.controls select[hidden]{display:none}
.years{max-width:1100px;margin:0 auto;padding:8px 20px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years[hidden]{display:none}
.years button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer}
.years button.on{background:var(--ink);color:#231b13;border-color:var(--ink)}
.status{max-width:1100px;margin:6px auto 0;padding:0 20px;color:var(--accent);font-size:13px;min-height:0}
.status:empty{display:none}

main{max-width:1100px;margin:0 auto;padding:4px calc(20px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.year-sec{margin-top:24px}
.year-head{display:flex;align-items:baseline;gap:12px;margin:0 4px 10px}
.year-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;margin:0;font-weight:600}
.year-head span{color:var(--muted);font-size:14px}

/* Bookcase */
.case{
  position:relative;border-radius:6px;padding:14px 16px 0;
  border:14px solid #5b381f;border-bottom-width:0;
  border-image:linear-gradient(180deg,#7a4b28,#5b381f 40%,#4a2d18) 14;
  background:
    linear-gradient(90deg, rgba(0,0,0,.55), transparent 7%, transparent 93%, rgba(0,0,0,.55)),
    #140f0b;
  box-shadow:0 20px 40px rgba(0,0,0,.45);
}
.case::after{ /* base */
  content:"";position:absolute;left:-14px;right:-14px;bottom:-18px;height:18px;
  background:linear-gradient(180deg,#6b4224,#3e2513);border-radius:0 0 4px 4px;
}
.shelf{
  display:flex;flex-wrap:wrap;column-gap:2px;row-gap:var(--plank);
  padding-bottom:var(--plank);margin:0 -16px;padding-left:16px;padding-right:16px;
  background-image:
    repeating-linear-gradient(180deg,
      transparent 0, transparent var(--row),
      #a0703f var(--row), #865a32 calc(var(--row) + var(--plank)*.45), #5e3b1f calc(var(--row) + var(--plank))),
    repeating-linear-gradient(180deg,
      rgba(0,0,0,.55) 0, rgba(0,0,0,0) 16px, transparent var(--row), transparent calc(var(--row) + var(--plank)));
  background-position:0 0, 0 calc(var(--row) + var(--plank));
}
.slot{height:var(--row);display:flex;align-items:flex-end}
.empty-row{height:var(--row);display:flex;align-items:center;justify-content:center;width:100%;color:#8e7c62;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:20px;text-align:center;padding:0 20px}

/* Spines */
.spine{
  position:relative;
  width:auto;min-width:calc(var(--w) * var(--s) * 1px);
  padding:0 calc(5px * var(--s));
  height:calc(var(--row) * var(--hp));
  background:var(--c);color:var(--t);
  border-radius:3px 3px 1px 1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow: inset 3px 0 4px rgba(255,255,255,.14), inset -5px 0 7px rgba(0,0,0,.38), 2px 0 3px rgba(0,0,0,.45);
  transition:transform .2s ease, filter .2s;
  border:0;
}
.spine:hover,.spine:focus-visible{transform:translateY(-7px);filter:brightness(1.08);outline:none}
.spine .txt{
  writing-mode:vertical-rl;transform:rotate(180deg);
  display:block;text-align:center;white-space:normal;
  max-height:100%;
  line-height:1.12;position:relative;z-index:1;
}
.spine .au{display:block;font-size:calc(8px * var(--s) + 1px);letter-spacing:.7px;text-transform:uppercase;opacity:.85;margin-block-end:4px;font-weight:500}
.spine .ti{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:calc(9.5px * var(--s) + 1px);letter-spacing:.2px}
.spine.v0::before,.spine.v0::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--g);opacity:.8;box-shadow:0 4px 0 var(--g)}
.spine.v0::before{top:9px}.spine.v0::after{bottom:15px}
.spine.v1::before{content:"";position:absolute;left:0;right:0;top:12px;height:18%;background:rgba(0,0,0,.28);border-top:1px solid var(--g);border-bottom:1px solid var(--g)}
.spine.v2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:rgba(0,0,0,.25)}
/* spazio riservato alle decorazioni, così le scritte non ci finiscono sopra */
.spine.v0{padding-top:21px;padding-bottom:23px}
.spine.v1{padding-top:calc(var(--row) * var(--hp) * .18 + 19px);padding-bottom:10px}
.spine.v2{padding-top:10px;padding-bottom:calc(var(--row) * var(--hp) * .12 + 6px)}
.spine.new{animation:drop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}

.nores{color:var(--muted);text-align:center;margin:60px 0;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic}

/* Overlay / sheet */
.overlay{position:fixed;inset:0;background:rgba(10,7,4,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay[hidden]{display:none}
.sheet{background:#231c15;border:1px solid #4a3d2e;border-radius:18px;width:100%;max-width:480px;max-height:calc(100vh - 40px);overflow:auto;padding:22px}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  #detOv{align-items:stretch}
  #detOv .sheet{border-radius:0;max-height:none;height:100%;padding-top:calc(18px + env(safe-area-inset-top));border:0;-webkit-overflow-scrolling:touch}
}
.sheet h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:0 0 14px}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;align-items:center;gap:2px}
.stars .star{position:relative;display:inline-block;font-size:30px;line-height:1;width:1em;text-align:center}
.stars .star button{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0;cursor:pointer}
.stars .star button.l{left:0}.stars .star button.r{right:0}
.stars .val{margin-left:10px;color:var(--muted);font-size:14px;min-width:30px}
.sglyph{background:linear-gradient(90deg,var(--accent) var(--f),#5d4c39 var(--f));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.spinecfg{display:flex;gap:14px;align-items:flex-end}
.spinecfg-opts{flex:1;min-width:0}
.spinecfg-prev{flex:0 0 auto;--row:150px;--s:1;height:150px;display:flex;align-items:flex-end;padding:0 6px;border-bottom:6px solid #8a5a33;background:#140f0b;border-radius:8px 8px 0 0;min-width:70px;justify-content:center}
.spinecfg-prev .spine{cursor:default}
.spinecfg-prev .spine:hover{transform:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.fcover{display:flex;gap:14px;align-items:flex-start}
.fcover-prev{flex:0 0 auto;width:80px;min-height:120px;display:flex;align-items:flex-end;justify-content:center;--row:120px;--s:.7}
.fcover-prev img{width:80px;height:auto;max-height:160px;border-radius:3px 5px 5px 3px;box-shadow:0 6px 14px rgba(0,0,0,.5);display:block}
.fcover-prev .spine{cursor:default}
.fcover-prev .spine:hover{transform:none}
.fcover-acts{flex:1;display:flex;flex-direction:column;gap:8px}
.fcover-acts .btn{width:100%}
.fcover-acts .btn[hidden]{display:none}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{background:var(--field);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tagpick button.on{background:#5a3f1f;border-color:var(--accent);color:var(--ink)}
.chip.tag{background:#3a2a17;border-color:#8a6a3a;color:#e6cfa6;cursor:pointer;font-size:11px;padding:3px 9px;font-family:inherit}
.seg button{background:var(--field);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:#231b13;border-color:var(--ink)}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.swatches .auto{width:auto;padding:0 10px;background:var(--field);color:var(--muted);font-size:12px;border:1px solid var(--line)}
.swatches .auto.on{border:2px solid var(--ink);color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.err{color:#e08a7c;font-size:13px;margin-top:10px}
.err:empty{display:none}
textarea.field{min-height:80px;resize:vertical}
.hbtns{display:flex;gap:8px;align-items:center}
.htitle{display:flex;align-items:center;gap:12px;min-width:0}
.iconbtn.back{font-size:28px;padding-bottom:3px;flex:0 0 auto}
.iconbtn[hidden],.btn[hidden],.home[hidden],.stats[hidden],#viewLib[hidden]{display:none}
#homeLink{cursor:pointer}
#fYearBox[hidden],#fDoneBox[hidden]{display:none}
.row2.single{grid-template-columns:1fr}
.home{max-width:1100px;margin:0 auto;padding:18px calc(20px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 110px - env(safe-area-inset-top));min-height:calc(100dvh - 110px - env(safe-area-inset-top))}

.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(180deg,#2a2119,#211a13);border:1px solid #4a3d2e;border-radius:20px;padding:18px;color:var(--ink);cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .15s, border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.card-art{flex:0 0 auto;width:120px;height:96px;border-radius:10px;background:#140f0b;display:flex;align-items:flex-end;gap:2px;padding:0 8px;position:relative;overflow:hidden;border-bottom:8px solid #8a5a33}
.card-art .spine{cursor:default;box-shadow:inset 2px 0 2px rgba(255,255,255,.12), inset -3px 0 4px rgba(0,0,0,.35)}
.card-art .spine .txt{display:none}
.card-art .spine:hover{transform:none}
.card-art.bars{gap:6px;padding:10px 12px 0;align-items:flex-end;border-bottom:0;background:#140f0b}
.card-art.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;opacity:.9;min-height:4px}
.card-body{flex:1;min-width:0;overflow:hidden}
@media (max-width:420px){ .card{gap:12px;padding:16px 14px} .card-art{width:96px;height:84px} .chev{font-size:26px} }
.card-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1}
.card-sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.4}
.chev{font-size:30px;color:var(--muted);flex:0 0 auto}
.stats{max-width:760px;margin:0 auto;padding:10px calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.stat-hero{background:linear-gradient(180deg,#2a2119,#211a13);border:1px solid #4a3d2e;border-radius:20px;padding:22px;text-align:center;margin-top:10px}
.stat-hero .num{font-family:"Cormorant Garamond",Georgia,serif;font-size:72px;font-weight:600;line-height:1;color:var(--accent)}
.stat-hero .lbl{color:var(--muted);font-size:15px;margin-top:6px}
.stats h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:28px 4px 12px}
.yrow.tagrow{grid-template-columns:110px 1fr 44px}
.yrow{display:grid;grid-template-columns:56px 1fr 44px;align-items:center;gap:12px;padding:12px 14px;background:#231c15;border:1px solid #3d3226;border-radius:14px;margin-bottom:10px;cursor:pointer;width:100%;color:var(--ink);text-align:left;font:inherit}
.yrow:hover{border-color:var(--accent)}
.yrow .y{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600}
.yrow .track{height:12px;background:#140f0b;border-radius:99px;overflow:hidden}
.yrow .fill{height:100%;background:linear-gradient(90deg,#b8843f,var(--accent));border-radius:99px}
.yrow .n{text-align:right;font-weight:600;font-size:17px}
.span2{grid-column:1/-1}
#homeBanner:empty{display:none}
.wishview{max-width:1100px;margin:0 auto;padding:4px calc(20px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.wishview[hidden]{display:none}
.card-art.wish{align-items:flex-end;border-bottom:8px solid #8a5a33}
.card-art.wish .lens{position:absolute;right:6px;bottom:-4px;width:70px;height:70px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));pointer-events:none}
.wish-note{white-space:pre-wrap;line-height:1.5;font-size:13px;text-align:justify;background:var(--field);border-radius:12px;padding:12px 14px;margin-top:14px}
.reading{background:linear-gradient(180deg,#2e2418,#231b13);border:1px solid #6b5132;border-radius:20px;padding:16px 16px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.reading-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reading-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;margin:0}
.ritem{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:10px 0;cursor:pointer;font:inherit;border-top:1px solid #3d3226}
.ritem:first-of-type{border-top:0}
.ritem .thumb{flex:0 0 auto;width:52px;height:78px;display:flex;align-items:flex-end;justify-content:center;--row:78px;--s:.55}
.ritem .thumb img{width:52px;height:78px;object-fit:cover;border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.ritem .thumb .spine{cursor:pointer}
.ritem .rinfo{flex:1;min-width:0}
.ritem .rt{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;font-weight:700;line-height:1.15}
.ritem .ra{color:var(--muted);font-size:13px;margin-top:2px}
.rbar{height:8px;background:#140f0b;border-radius:99px;overflow:hidden;margin-top:9px}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#b8843f,var(--accent));border-radius:99px}
.rmeta{color:var(--muted);font-size:12px;margin-top:5px}
.rcovers{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none}
.rcovers::-webkit-scrollbar{display:none}
.rcover{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;align-self:flex-start;flex:0 0 auto;width:68px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:center;font:inherit}
.rc-img{display:flex;align-items:flex-end;justify-content:center;width:48px;height:72px;--row:72px;--s:.4}
.rc-img img{width:48px;height:72px;object-fit:cover;border-radius:2px 4px 4px 2px;box-shadow:0 5px 12px rgba(0,0,0,.55)}
.rc-img .spine{cursor:pointer;padding:0;min-width:16px}
.rc-img .spine .txt{display:none}
.rc-t{font-size:11px;line-height:1.25;margin-top:6px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.miss-list{margin-top:12px}
.miss-y{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600;margin:14px 2px 6px;color:var(--accent)}
.miss-row{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;color:var(--ink);cursor:pointer;font:inherit}
.miss-row b{display:block;font-size:14px;font-weight:600}
.miss-row span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.credits{text-align:center;color:#8e7c62;font-size:12px;line-height:1.6;margin-top:auto;padding-top:24px;letter-spacing:.3px}
.credits b{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.banner{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:#3a2a17;border:1px solid #8a6a3a;border-radius:16px;padding:14px 16px}
.banner b{display:block;font-size:15px}
.banner span{display:block;color:#e6cfa6;font-size:13px;margin-top:3px;line-height:1.4}
.banner-acts{display:flex;gap:8px;margin-left:auto}
.goal{background:#231c15;border:1px solid #3d3226;border-radius:18px;padding:18px;margin-top:14px}
.goal-head{display:flex;justify-content:space-between;align-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px Inter,sans-serif;cursor:pointer;padding:4px}
.goal-num{margin-top:10px;font-size:15px;color:var(--muted)}
.goal-num b{font-size:26px;color:var(--ink);font-weight:600;margin-right:2px}
.goal-num span{float:right;color:var(--accent);font-weight:600;font-size:18px;margin-top:6px}
.goal-track{height:14px;background:#140f0b;border-radius:99px;overflow:hidden;margin-top:10px}
.goal-fill{height:100%;background:linear-gradient(90deg,#b8843f,var(--accent));border-radius:99px;transition:width .4s}
.goal-txt{color:var(--muted);font-size:14px;line-height:1.45;margin:10px 0 12px}
.goal .btn{width:100%}
.yrow .n small{color:var(--muted);font-weight:500;font-size:13px}
.subnav{display:grid;grid-template-columns:1fr;gap:10px}

<script>
(() => {
const APP_VERSION = "1.49";
const PALETTE = ["#7a2e2a","#2f4a3a","#23395b","#c49a3a","#e6d9bd","#1f1d1b","#2c5d63","#5a3550","#a2512b","#6b7b8c","#6b6a3a","#8c2f4b","#3d3a6b","#b8b2a3","#45604d","#9b6b43"];
const NOW_YEAR = new Date().getFullYear();
const state = { fIsbn: null, mode: "spine", books: [], view: NOW_YEAR, q: "", author: "", tag: "", ftags: [], newId: null, editing: null, rating: 0, color: "" };


const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function lum(hex){ const n = parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)/255; }
function setStatus(t){ $("status").textContent = t || ""; }

function spineHTML(b, extraClass = ""){
  const h = hash((b.title||"") + "|" + (b.author||""));
  const color = b.color || PALETTE[h % PALETTE.length];
  const light = lum(color) > 0.6;
  const text = light ? "#2a2018" : "#f4ead6";
  const gold = light ? "#7a5a2a" : "#d8b26a";
  const pages = Number(b.pages) || 0;
  const w = Number(b.spineW) || (pages ? Math.max(22, Math.min(60, 16 + pages / 14)) : 26 + (h >>> 4) % 16);
  const hp = (Number(b.spineH) || (0.80 + ((h >>> 9) % 17) / 100)).toFixed(2);
  const v = (h >>> 13) % 3;
  return `<button class="spine v${v} ${extraClass}" data-id="${esc(b.id)}" title="${esc(b.title)} — ${esc(b.author)}"
    style="--c:${color};--t:${text};--g:${gold};--w:${w.toFixed(0)};--hp:${hp}">
    <span class="txt"><span class="au">${esc(b.author)}</span><span class="ti">${esc(b.title)}</span></span></button>`;
}

const PARTICLES = new Set(["de","di","da","del","della","dello","dei","degli","dal","dalla","lo","la","le","van","von","der","den","du","des","dos","mac"]);
const ARTICLES = new Set(["gli","i","il","la","le","lo","the","l'"]);
// Nomi già scritti con il cognome per primo (uso orientale)
const SURNAME_FIRST = new Set(["kashiwai hisashi","murata sayaka","hu anyan"]);
function flipName(name){
  if (SURNAME_FIRST.has(name.trim().toLowerCase())) return name.trim();
  const w = name.trim().split(/\s+/);
  if (w.length < 2 || ARTICLES.has(w[0].toLowerCase())) return name.trim();
  let i = w.length - 1;
  while (i > 1 && PARTICLES.has(w[i-1].toLowerCase())) i--;
  return w.slice(i).join(" ") + " " + w.slice(0, i).join(" ");
}
function authorLabel(a){ return String(a || "").split(",").map(flipName).filter(Boolean).join(", "); }
function sortKey(b){ return (b.finished || String(b.createdAt || "").slice(0,10)) + "|" + (b.createdAt || ""); }
function readList(){ return state.books.filter(b => !b.reading && !b.list); }
function listOf(kind){ return state.books.filter(b => b.list === kind).sort((a,b) => String(a.createdAt||"").localeCompare(String(b.createdAt||""))); }
function readingList(){ return state.books.filter(b => b.reading).sort((a,b) => String(a.started||a.createdAt||"").localeCompare(String(b.started||b.createdAt||""))); }
function allTags(){
  const set = new Set();
  for (const b of state.books) for (const t of b.tags || []) set.add(t);
  return [...set].sort((a,b) => a.localeCompare(b, "it"));
}
function cleanTag(t){ return String(t || "").replace(/\s+/g, " ").trim().slice(0, 30); }
function matches(b){
  if (state.author && b.author !== state.author) return false;
  if (state.tag && !(b.tags || []).includes(state.tag)) return false;
  if (state.q){ const q = norm(state.q); if (!norm(b.title).includes(q) && !norm(b.author).includes(q) && !(b.tags || []).some(t => norm(t).includes(q))) return false; }
  return true;
}

function coverItemHTML(b){
  const h = hash((b.title||"") + "|" + (b.author||""));
  const col = b.color || PALETTE[h % PALETTE.length];
  return `<button class="citem" data-id="${esc(b.id)}" title="${esc(b.title)} — ${esc(b.author)}"><div class="cimg" style="--c:${col};--t:${lum(col) > .6 ? "#2a2018" : "#f4ead6"}"><div class="ph"><b>${esc(b.title)}</b><i>${esc(b.author)}</i></div></div><b>${esc(b.title)}</b><span>${esc(b.author)}</span></button>`;
}
function shelfHTML(list, emptyTxt){
  if (!list.length) return `<div class="case"><div class="shelf"><div class="empty-row">${emptyTxt}</div></div></div>`;
  if (state.mode === "cover") return `<div class="cgrid">${list.map(coverItemHTML).join("")}</div>`;
  return `<div class="case"><div class="shelf">${list.map(b => `<div class="slot">${spineHTML(b, b.id === state.newId ? "new" : "")}</div>`).join("")}</div></div>`;
}
function hydrateCovers(root){
  if (state.mode !== "cover") return;
  root.querySelectorAll(".citem").forEach(async el => {
    const b = state.books.find(x => x.id === el.dataset.id); if (!b) return;
    const src = await coverSrc(b); if (!src) return;
    const box = el.querySelector(".cimg"); if (!box || box.querySelector("img")) return;
    const im = document.createElement("img"); im.alt = ""; im.loading = "lazy"; im.src = src; im.onerror = () => im.remove();
    box.appendChild(im);
  });
}
function authorSortLabel(b){ return b.authorSort || authorLabel(b.author); }
function letterOfBook(b){ const c = norm(authorSortLabel(b)).replace(/[^a-z]/g, "").charAt(0).toUpperCase(); return c || "#"; }
function markToggles(){
  document.querySelectorAll("#viewToggle button, #wishToggle button").forEach(b => b.classList.toggle("on", b.dataset.m === state.mode)); }
function setMode(m){ state.mode = m === "cover" ? "cover" : "spine"; setMeta("viewMode", state.mode === "cover" ? "cover" : null); render(); }
function render(){
  try { renderHome(); renderStats(); renderWish(); renderReading(); } catch(e){ console.error(e); }
  const books = readList();
  const years = [...new Set([NOW_YEAR, ...books.map(b => Number(b.year)).filter(Boolean)])].sort((a,b) => b-a);
  if (state.view !== "all" && !years.includes(state.view)) state.view = NOW_YEAR;

  // subtitle
  const thisYear = books.filter(b => Number(b.year) === NOW_YEAR).length;
  $("sub").textContent = books.length
    ? `${books.length} ${books.length === 1 ? "libro letto" : "libri letti"} · ${thisYear} nel ${NOW_YEAR}`
    : "Lo scaffale ti aspetta";

  // year tabs
  $("years").innerHTML = `<button data-y="all" class="${state.view==="all"?"on":""}">Tutti</button>` +
    years.map(y => `<button data-y="${y}" class="${state.view===y?"on":""}">${y}</button>`).join("");

  // authors
  const labels = {};
  for (const b of books){ if (b.author && (!labels[b.author] || b.authorSort)) labels[b.author] = b.authorSort || labels[b.author] || authorLabel(b.author); }
  const authors = Object.keys(labels).sort((a,b) => labels[a].localeCompare(labels[b], "it"));
  const sel = $("authorSel");
  if (state.author && !authors.includes(state.author)) state.author = "";
  sel.innerHTML = `<option value="">Tutti gli autori</option>` + authors.map(a => `<option value="${esc(a)}" ${a===state.author?"selected":""}>${esc(labels[a])}</option>`).join("");
  $("authorList").innerHTML = authors.map(a => `<option value="${esc(a)}">`).join("");

  // etichette
  const tags = allTags();
  if (state.tag && !tags.includes(state.tag)) state.tag = "";
  $("tagSel").innerHTML = `<option value="">Tutti i generi</option>` + tags.map(t => `<option value="${esc(t)}" ${t===state.tag?"selected":""}>${esc(t)}</option>`).join("");
  $("tagSel").hidden = !tags.length;

  // shelves
  const filtering = !!(state.q || state.author || state.tag);

  const shown = state.view === "all" ? years : [state.view];
  let html = "", total = 0;
  for (const y of shown){
    const list = books.filter(b => Number(b.year) === y && matches(b)).sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
    total += list.length;
    if (!list.length && (filtering || state.view === "all")) continue;
    const n = books.filter(b => Number(b.year) === y).length;
    const label = filtering ? `${list.length} di ${n}` : `${n} ${n===1?"libro":"libri"}`;
    html += `<section class="year-sec"><div class="year-head"><h2>${y}</h2><span>${label}</span></div>` +
      shelfHTML(list, `Nessun libro ancora: aggiungi il primo del ${y}`) + `</section>`;
  }
  if (!books.length){
    html = `<div class="welcome"><h2>Benvenuto nella tua libreria</h2>
      <p>Aggiungi il primo libro letto, oppure importa un backup per ritrovare tutta la tua libreria.</p>
      <div class="actions"><button class="btn ghost" id="wImport">Importa backup</button><button class="btn" id="wAdd">Aggiungi libro</button></div></div>`;
  } else if (!html){
    html = filtering ? `<p class="nores">Nessun libro corrisponde alla ricerca</p>`
                     : `<p class="nores">Nessun libro sugli scaffali</p>`;
  }
  $("main").innerHTML = html;
  markToggles(); $("viewToggle").hidden = !books.length;
  hydrateCovers($("main"));
  state.newId = null;
}

function showView(v, push = true){
  if (!["home","libreria","statistiche","dacercare"].includes(v)) v = "home";
  currentView = v;
  $("viewHome").hidden = v !== "home";
  $("viewLib").hidden = v !== "libreria";
  $("viewStats").hidden = v !== "statistiche";
  $("viewWish").hidden = v !== "dacercare";
  $("backBtn").hidden = v === "home";
  $("addBtn").hidden = v !== "libreria" && v !== "dacercare";
  if (push){
    const h = v === "home" ? "" : "#" + v;
    if (location.hash !== h) history.pushState(null, "", h || location.pathname);
  }
  window.scrollTo(0, 0);
  render();
}

function groupBy(kind){
  const m = new Map();
  for (const b of readList()){
    const py = Number(b.pubYear) || 0;
    const keys = kind === "genere" ? (b.tags && b.tags.length ? b.tags : ["Senza genere"]) : kind === "anno" ? [String(b.year)]
      : kind === "voto" ? [b.rating ? String(b.rating) : "Senza voto"]
      : kind === "pub" ? [py ? String(pubMode === "decennio" ? Math.floor(py / 10) * 10 : py) : "Senza anno"]
      : [b.author];
    for (const k of keys){ if (!m.has(k)) m.set(k, []); m.get(k).push(b); }
  }
  const label = k => kind === "autore" ? (m.get(k).find(x => x.authorSort)?.authorSort || authorLabel(k))
    : kind === "voto" ? (k === "Senza voto" ? k : `${fmtRating(k)} ★`)
    : kind === "pub" && pubMode === "decennio" && k !== "Senza anno" ? `Anni ${k}` : k;
  const arr = [...m.keys()].map(k => ({ key: k, label: label(k), books: m.get(k).sort((a,b) => kind === "anno" ? sortKey(a).localeCompare(sortKey(b)) : ((Number(b.year) - Number(a.year)) || a.title.localeCompare(b.title, "it"))) }));
  if (kind === "anno") return arr.sort((a,b) => Number(b.key) - Number(a.key));
  if (kind === "voto" || kind === "pub") return arr.sort((a,b) => (Number(b.key) || -1) - (Number(a.key) || -1));
  if (kind === "autore" && authSort === "az") return arr.sort((a,b) => a.label.localeCompare(b.label, "it", { sensitivity: "base" }));
  return arr.sort((a,b) => ((a.key === "Senza genere") - (b.key === "Senza genere")) || (b.books.length - a.books.length) || a.label.localeCompare(b.label, "it"));
}

const BUL = "• ";
// Mette il pallino all'inizio di ogni riga con testo, mantenendo la posizione del cursore
function bulletize(text, caret){
  const lines = text.split("\n"); let pos = 0, newCaret = caret, out = [];
  for (const line of lines){
    let l = line;
    const clean = l.replace(/^\s*[•\-\*]\s*/, "");
    if (clean.trim() && !l.startsWith(BUL)){
      const removed = l.length - clean.length;
      l = BUL + clean;
      if (caret > pos) newCaret += Math.min(caret - pos, l.length) === 0 ? 0 : (BUL.length - removed);
    }
    out.push(l); pos += line.length + 1;
  }
  return { text: out.join("\n"), caret: Math.max(0, newCaret) };
}

const WRITER_RE = /scrittor|scrittric|romanzier|poet|giornalist|saggist|drammaturg|filosof|storic|fumettist|autore|autrice|sceneggiator|letterat|accademic|traduttor|\b(writer|novelist|author|poet|journalist|essayist|playwright|philosopher|historian|screenwriter|cartoonist|comics|columnist|academic|translator|critic)\b/i;
const anorm = s => norm(s).replace(/[^a-z0-9]/g, "");
function authorSearchName(a){ return String(a || "").split(/\s*(?:,|;|&|\/|\se\s|\sand\s)\s*/)[0].trim(); }
function authorUrlMap(){ return getMeta().authorPhotoUrls || {}; }
function authorAutoMap(){ return getMeta().authorAuto || {}; }
async function wikiPagesL(lang, params){
  const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|description&piprop=thumbnail&pithumbsize=1000&` + params);
  if (!r.ok) throw 0; const j = await r.json(); return Object.values(j.query?.pages || {}).filter(p => !("missing" in p));
}
async function authorWikiCandidates(name){
  const out = [], seen = new Set(), n = anorm(name);
  const add = (p, lang) => { if (p.thumbnail && !seen.has(p.thumbnail.source)){ seen.add(p.thumbnail.source); out.push({ src: p.thumbnail.source, thumb: p.thumbnail.source, label: p.title, from: "Wikipedia " + lang, exact: anorm(p.title.replace(/\s*\(.*\)$/, "")) === n }); } };
  for (const lang of ["it", "en"]){
    const suff = lang === "it" ? ["scrittore", "scrittrice", "poeta", "giornalista"] : ["writer", "author", "novelist", "poet"];
    try {
      const pages = await wikiPagesL(lang, "titles=" + encodeURIComponent([name, ...suff.map(x => `${name} (${x})`)].join("|")));
      for (const p of pages) if (WRITER_RE.test(p.description || "")) add(p, lang);
    } catch(e){}
    try {
      const pages = (await wikiPagesL(lang, "generator=search&gsrlimit=5&gsrsearch=" + encodeURIComponent(name + (lang === "it" ? " scrittore" : " writer")))).sort((a, b) => a.index - b.index);
      for (const p of pages) if (WRITER_RE.test(p.description || "") && anorm(p.title.replace(/\s*\(.*\)$/, "")) === n) add(p, lang);
    } catch(e){}
  }
  return out;
}
async function authorOLCandidates(name){
  try {
    const r = await fetch("https://openlibrary.org/search/authors.json?limit=5&q=" + encodeURIComponent(name)); if (!r.ok) return [];
    const j = await r.json(); const n = anorm(name);
    return (j.docs || []).filter(d => anorm(d.name) === n).slice(0, 2).map(d => ({ src: `https://covers.openlibrary.org/a/olid/${d.key}-L.jpg?default=false`, thumb: `https://covers.openlibrary.org/a/olid/${d.key}-M.jpg?default=false`, label: d.name, from: "Open Library", exact: true }));
  } catch(e){ return []; }
}
async function imageUrlToBlobL(src){
  const r = await fetch(src, { mode: "cors" }); if (!r.ok) throw 0;
  const b = await r.blob(); if (b.size < 1500) throw 0; const url = URL.createObjectURL(b);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
  } finally { URL.revokeObjectURL(url); }
}
async function authorHasPhoto(k){ try { if (await idb.get("author:" + k)) return true; } catch(e){} return !!authorUrlMap()[k]; }
function setAuthorFlags(k, auto, src){
  const m = getMeta(); const a = { ...(m.authorAuto || {}) }, sr = { ...(m.authorPhotoSrc || {}) };
  if (auto){ a[k] = true; sr[k] = src; } else { delete a[k]; delete sr[k]; }
  setMeta("authorAuto", a); setMeta("authorPhotoSrc", sr);
}
function dropAuthorURL(k){ const key = "author:" + k; if (aPhotoURLs[key]){ if (aPhotoURLs[key].startsWith("blob:")) URL.revokeObjectURL(aPhotoURLs[key]); delete aPhotoURLs[key]; } }
async function saveAuthorPhoto(k, src, auto){
  const urls = { ...authorUrlMap() };
  try { const blob = await imageUrlToBlobL(src); if (!blob) throw 0; await idb.set("author:" + k, blob); delete urls[k]; }
  catch(e){ try { await idb.del("author:" + k); } catch(_){} urls[k] = src; const im = new Image(); im.src = src; }
  setMeta("authorPhotoUrls", urls); setAuthorFlags(k, auto, src); dropAuthorURL(k);
  setMeta("lastChangeAt", new Date().toISOString());
}
// Mette la foto solo se manca, o se quella attuale era stata messa in automatico: mai sopra una foto tua.
async function autoAuthorPhoto(name){
  const k = authorKey(name);
  if (await authorHasPhoto(k) && !authorAutoMap()[k]) return "had";
  const q = authorSearchName(name);
  const c = (await authorWikiCandidates(q)).find(x => x.exact);
  if (!c) return (await authorHasPhoto(k)) ? "had" : "none";
  if (authorAutoMap()[k] && (getMeta().authorPhotoSrc || {})[k] === c.src) return "had";
  await saveAuthorPhoto(k, c.src, true); return "new";
}

function growKeep(el, min){
  const det = document.getElementById("det");
  const wy = window.scrollY, dy = det ? det.scrollTop : 0, h = el.offsetHeight;
  el.style.height = h + "px";
  const need = Math.max(min, el.scrollHeight + 2);
  if (need > h){ el.style.height = need + "px"; }
  else { el.style.height = "1px"; el.style.height = Math.max(min, el.scrollHeight + 2) + "px"; }
  window.scrollTo(0, wy); if (det) det.scrollTop = dy;
}

/* ---------- Obiettivo annuale ---------- */
function goalInfo(year){
  const goal = Number(getGoals()[year]) || 0;
  const read = readList().filter(b => Number(b.year) === year).length;
  return { goal, read };
}
function paceText(read, goal){
  const now = new Date();
  const start = new Date(NOW_YEAR, 0, 1), end = new Date(NOW_YEAR + 1, 0, 1);
  const frac = (now - start) / (end - start);
  const expected = goal * frac;
  const diff = Math.round(read - expected);
  if (read >= goal) return "Obiettivo raggiunto! 🎉";
  const left = goal - read;
  const daysLeft = Math.max(1, Math.ceil((end - now) / 86400000));
  const pace = diff > 0 ? `Sei avanti di ${diff} ${diff===1?"libro":"libri"}` : diff < 0 ? `Sei indietro di ${-diff} ${diff===-1?"libro":"libri"}` : "Sei perfettamente in linea";

function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : Infinity; }
function backupDue(){

function lastBackupText(){

  return "Ultimo backup: " + (n === 0 ? "oggi" : n === 1 ? "ieri" : `${n} giorni fa`) + ` (${new Date(d).toLocaleDateString("it-IT")}).`;
}

/* ---------- Copie automatiche giornaliere ---------- */
const SNAP_PREFIX = "libreria.", SNAP_DB = "libreria-copie", SNAP_KEEP = 7;
function dayKey(d = new Date()){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function snapDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(SNAP_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("snaps", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function snapCollect(){ const data = {}; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(SNAP_PREFIX)) data[k] = localStorage.getItem(k); } return data; }
async function snapAll(){
  const db = await snapDB();
  return new Promise(res => { const q = db.transaction("snaps").objectStore("snaps").getAll(); q.onsuccess = () => res((q.result || []).sort((a, b) => b.at.localeCompare(a.at))); q.onerror = () => res([]); });
}
async function snapPut(rec){
  const db = await snapDB();
  return new Promise((res, rej) => { const t = db.transaction("snaps", "readwrite"); t.objectStore("snaps").put(rec); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function snapDelete(ids){
  if (!ids.length) return; const db = await snapDB();
  return new Promise(res => { const t = db.transaction("snaps", "readwrite"); const s = t.objectStore("snaps"); ids.forEach(id => s.delete(id)); t.oncomplete = res; t.onerror = res; });
}
async function snapDaily(){
  try {
    if (!snapCount(snapCollect())) return;
    const all = await snapAll(), today = dayKey();
    if (!all.some(s => s.id === today)) await snapPut({ id: today, at: new Date().toISOString(), data: snapCollect() });
    const daily = (await snapAll()).filter(s => !s.id.startsWith("r"));
    const pre = (await snapAll()).filter(s => s.id.startsWith("r"));
    await snapDelete([...daily.slice(SNAP_KEEP), ...pre.slice(1)].map(s => s.id));
  } catch(e){}
}
function snapLabel(s){
  const d = new Date(s.at), t = dayKey(), y = dayKey(new Date(Date.now() - 86400000));
  const when = s.id === t ? "Oggi" : s.id === y ? "Ieri" : d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
  return (s.id.startsWith("r") ? "Prima del ripristino · " + d.toLocaleDateString("it-IT") : when.charAt(0).toUpperCase() + when.slice(1)) + " · ore " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
}
async function openSnapshots(){
  let list = []; try { list = await snapAll(); } catch(e){}
  $("menu").innerHTML = `
    <h3>Copie automatiche</h3>
    <p>Ogni giorno, alla prima apertura, l'app salva da sola una copia dei dati e tiene le ultime ${SNAP_KEEP}. Servono a tornare indietro dopo un errore; le copertine e le foto non sono incluse (restano come sono). Non sostituiscono il backup: se perdi il telefono si perdono anche queste.</p>
    <div class="miss-list">${list.length ? list.map(s => `<button class="miss-row" data-snap="${esc(s.id)}"><b>${esc(snapLabel(s))}</b><span>${snapUnits(snapCount(s.data))}</span></button>`).join("") : "<p>Nessuna copia ancora: la prima verrà fatta alla prossima apertura.</p>"}</div>
    <div class="err" id="snErr"></div>
    <div class="actions"><button class="btn ghost" id="snBack">Indietro</button></div>`;
  $("menuOv").hidden = false; $("menu").scrollTop = 0;
  $("snBack").onclick = () => openMenu();
  $("menu").querySelectorAll("[data-snap]").forEach(b => b.onclick = async () => {
    const s = list.find(x => x.id === b.dataset.snap); if (!s) return;
    if (!(await askConfirm("Ripristinare questa copia?", `I dati torneranno com'erano: ${snapLabel(s).toLowerCase()} (${snapUnits(snapCount(s.data))}). Le modifiche fatte dopo andranno perse; prima di procedere salvo comunque una copia dello stato attuale.`, "Ripristina", true))) return;
    try {
      const now = new Date().toISOString();
      await snapPut({ id: "r" + Date.now(), at: now, data: snapCollect() });
      const keepMeta = (() => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } })();
      Object.keys(snapCollect()).forEach(k => localStorage.removeItem(k));
      Object.entries(s.data).forEach(([k, v]) => localStorage.setItem(k, v));
      const m = (() => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } })();
      for (const k of SNAP_KEEP_META) if (keepMeta[k] !== undefined) m[k] = keepMeta[k]; else delete m[k];
      m.lastChangeAt = now;
      localStorage.setItem(META_KEY, JSON.stringify(m));
      location.reload();
    } catch(e){ $("snErr").textContent = "Ripristino non riuscito."; }
  });
}
function backupLabelDue(m){
  if (m.snoozeUntil && Date.now() < new Date(m.snoozeUntil).getTime()) return false;
  if (!m.lastBackupAt) return !!m.lastChangeAt;
  const changed = !!m.lastChangeAt && new Date(m.lastChangeAt) > new Date(m.lastBackupAt);
  if (!changed || dayKey(new Date(m.lastBackupAt)) === dayKey()) return false;
  return new Date().getHours() >= 20 || Date.now() - new Date(m.lastBackupAt).getTime() >= 2 * 86400000;
}
function snoozeTomorrow(){ const d = new Date(); d.setHours(24, 0, 0, 0); return d.toISOString(); }
const SNAP_UNIT = "libri", SNAP_KEEP_META = ["lastBackupAt", "snoozeUntil", "firstSeenAt", "viewMode", "textScale", "authSort"];
function snapUnits(n){ return n + " " + (n === 1 ? "libro" : SNAP_UNIT); }
function snapCount(data){ try { return (JSON.parse(data[KEY] || "[]") || []).filter(b => !b.list && !b.reading).length; } catch(e){ return 0; } }
function backupBannerText(m){
  if (!m.lastBackupAt) return "Non hai ancora salvato un backup. Un tocco e lo metti su iCloud (Salva su File).";
  const n = daysSince(m.lastBackupAt);
  return `Hai fatto modifiche dopo l'ultimo backup (${n <= 0 ? "oggi" : n === 1 ? "ieri" : n + " giorni fa"}). Un tocco e lo salvi su iCloud.`;
}

  if (e && e.code === "storage") return "Non riesco a salvare sul dispositivo (memoria piena o navigazione privata).";
  return "Salvataggio non riuscito, riprova.";
}

/* ---------- Copertine (IndexedDB, disponibili offline) ---------- */
const idb = (() => {
  let dbp = null;
  function open(){
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("libreria", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("covers");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("covers", mode);
      const req = fn(t.objectStore("covers"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get: id => run("readonly", s => s.get(id)),
    set: (id, v) => run("readwrite", s => s.put(v, id)),
    del: id => run("readwrite", s => s.delete(id)),
    clear: () => run("readwrite", s => s.clear()),
  };
})();
const coverURLs = {};
async function coverSrc(b){
  if (b.coverLocal){
    if (coverURLs[b.id]) return coverURLs[b.id];
    try { const blob = await idb.get(b.id); if (blob){ coverURLs[b.id] = URL.createObjectURL(blob); return coverURLs[b.id]; } } catch(e){}
  }
  return b.coverUrl || null;
}
function dropCoverURL(id){ if (coverURLs[id]){ URL.revokeObjectURL(coverURLs[id]); delete coverURLs[id]; } }
function updateBook(id, patch){
  const i = state.books.findIndex(b => b.id === id); if (i < 0) return null;
  state.books[i] = { ...state.books[i], ...patch, updatedAt: new Date().toISOString() };
  persist(); return state.books[i];
}
async function setCoverFromUrl(id, url){
  dropCoverURL(id);
  try {
    const r = await fetch(url, { mode: "cors" });
    if (!r.ok) throw 0;
    const blob = await r.blob();
    if (!/^image\//.test(blob.type) || blob.size < 1500) throw 0;
    await idb.set(id, blob);
    return updateBook(id, { coverUrl: url, coverLocal: true });
  } catch(e){
    try { await idb.del(id); } catch(_){}
    const im = new Image(); im.src = url; // il service worker la conserva per l'uso offline
    return updateBook(id, { coverUrl: url, coverLocal: false });
  }
}
async function setCoverFromBlob(id, blob){
  dropCoverURL(id);
  await idb.set(id, blob);
  return updateBook(id, { coverUrl: null, coverLocal: true });
}
async function removeCover(id){
  dropCoverURL(id);
  try { await idb.del(id); } catch(e){}
  return updateBook(id, { coverUrl: null, coverLocal: false });
}
async function photoToBlob(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 900, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
let googleBusyUntil = 0;
async function searchCovers(b){
  const out = [];
  const add = u => { if (u && !out.includes(u)) out.push(u); };
  const title = b.title.length > 40 ? b.title.split(/[.:]/)[0].trim() : b.title;
  const author = b.author.split(",")[0].trim();
  const getJSON = async url => { const r = await fetch(url); if (r.status === 429) { googleBusyUntil = Date.now() + 20000; return null; } if (!r.ok) return null; return r.json(); };

  // 1) Apple Books (negozio italiano): copertine delle edizioni italiane
  const apple = async term => {
    const j = await getJSON(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=ebook&entity=ebook&country=it&limit=10`);
    for (const r of (j && j.results) || []){
      if (r.artworkUrl100) add(r.artworkUrl100.replace(/\/\d+x\d+bb\./, "/400x600bb."));
    }
  };
  try { await apple(`${title} ${author}`); } catch(e){}
  if (!out.length) try { await apple(title); } catch(e){}

  // 2) Google Books
  const google = async (q, lang) => {
    if (Date.now() < googleBusyUntil) return;
    const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=10&printType=books${lang ? "&langRestrict=it" : ""}`);
    for (const it of (j && j.items) || []){
      const im = it.volumeInfo && it.volumeInfo.imageLinks;
      const t = im && (im.thumbnail || im.smallThumbnail);
      if (t) add(t.replace(/^http:/, "https:").replace("&edge=curl", ""));
    }
  };
  if (out.length < 6) try { await google(`intitle:${title} inauthor:${author}`, true); } catch(e){}
  if (out.length < 3) try { await google(`${title} ${author}`, false); } catch(e){}

  // 3) Open Library
  if (out.length < 3) try {
    const j = await getJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=10&fields=cover_i`);
    for (const d of (j && j.docs) || []) if (d.cover_i) add(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`);
  } catch(e){}
  return out.slice(0, 9);
}

async function findPubYear(b){
  const title = b.title.length > 40 ? b.title.split(/[.:]/)[0].trim() : b.title;
  const author = b.author.split(",")[0].trim();
  const years = [];
  try {
    const r = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=5&fields=first_publish_year`);
    if (r.ok){ const j = await r.json(); for (const d of j.docs || []) if (d.first_publish_year) years.push(d.first_publish_year); }
  } catch(e){}
  if (Date.now() >= googleBusyUntil) try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:${title} inauthor:${author}`)}&maxResults=20&printType=books`);
    if (r.status === 429) googleBusyUntil = Date.now() + 20000;
    else if (r.ok){ const j = await r.json(); for (const it of j.items || []){ const y = parseInt(((it.volumeInfo || {}).publishedDate || "").slice(0,4), 10); if (y > 1000) years.push(y); } }
  } catch(e){}
  const valid = years.filter(y => y > 1000 && y <= new Date().getFullYear());
  return valid.length ? Math.min(...valid) : null;
}

function backupName(){ return "libreria-backup-" + new Date().toISOString().slice(0,10) + ".json"; }
async function exportBackup(){
  const books = [];
  for (const b of state.books){
    const copy = { ...b };
    if (b.coverLocal){
      try {
        const blob = await idb.get(b.id);
        if (blob) copy.coverData = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      } catch(e){}
    }
    books.push(copy);
  }
  const authorPhotos = {}, authorPhotoUrlsOut = { ...authorUrlMap() };
  const akeys = new Set(state.books.map(b => authorKey(b.author)));
  for (const k of akeys){
    try {
      const blob = await idb.get("author:" + k);
      const asrc = authorAutoMap()[k] && (getMeta().authorPhotoSrc || {})[k];
      if (blob && asrc){ authorPhotoUrlsOut[k] = asrc; continue; }
      if (blob) authorPhotos[k] = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
    } catch(e){}
  }
  const payload = JSON.stringify({ app: "libreria", version: 3, exportedAt: new Date().toISOString(), goals: getGoals(), works: getMeta().works || {}, authorPhotos, authorPhotoUrls: authorPhotoUrlsOut, authorAuto: authorAutoMap(), authorPhotoSrc: getMeta().authorPhotoSrc || {}, books });
  const name = backupName();
  const file = new File([payload], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: "Backup libreria" });
      setMeta("lastBackupAt", new Date().toISOString()); setMeta("snoozeUntil", null);
      return "Backup pronto: salvalo su File, iCloud Drive o mandalo con AirDrop.";
    }
  } catch(e){ if (e && e.name === "AbortError") return ""; }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  setMeta("lastBackupAt", new Date().toISOString()); setMeta("snoozeUntil", null);
  return "Backup scaricato (" + name + ").";
}
async function exportCSV(){
  const cols = ["Anno di lettura","Titolo","Autore","Anno di pubblicazione","Voto","Pagine","Iniziato il","Finito il","Genere","Trama","L'autore","Note"];

               fmtD(b.started), fmtD(b.finished), (b.tags || []).join(", "), b.notes || "", b.quotes || "", b.mynotes || ""]);
  const cell = v => { const t = String(v ?? ""); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = "\ufeff" + [cols, ...rows].map(r => r.map(cell).join(";")).join("\r\n");
  const name = "diario-di-lettura-" + new Date().toISOString().slice(0,10) + ".csv";

function parseBackup(text){
  let data; try { data = JSON.parse(text); } catch(e){ throw new Error("Il file non è un backup valido."); }
  const list = Array.isArray(data) ? data : data && data.books;
  if (!Array.isArray(list)) throw new Error("Il file non contiene una libreria.");
  const out = [];
  for (const b of list){
    if (!b || typeof b.title !== "string" || typeof b.author !== "string") continue;
    const year = parseInt(b.year, 10); if (!year && !b.reading && !b.list) continue;
    out.push({
      id: String(b.id || ("b" + Math.random().toString(36).slice(2,10))),
      title: b.title.trim(), author: b.author.trim(), year,
      pages: parseInt(b.pages, 10) || null, finished: typeof b.finished === "string" ? b.finished : null,
      rating: Math.round(Math.min(5, Math.max(0, Number(b.rating) || 0)) * 2) / 2 || null, color: typeof b.color === "string" && /^#[0-9a-f]{6}$/i.test(b.color) ? b.color : null,
      notes: typeof b.notes === "string" ? b.notes : null,
      quotes: typeof b.quotes === "string" ? b.quotes : null,
      mynotes: typeof b.mynotes === "string" ? b.mynotes : null,
      isbn: typeof b.isbn === "string" && /^\d{10,13}X?$/i.test(b.isbn) ? b.isbn : null,
      started: typeof b.started === "string" ? b.started.slice(0,10) : null,
      ...(b.reading ? { reading: true, year: null } : {}),
      ...(b.list === "wish" || b.list === "toread" ? { list: b.list, year: null } : {}),
      tags: Array.isArray(b.tags) ? [...new Set(b.tags.map(cleanTag).filter(Boolean))].slice(0, 20) : null,
      spineW: [22,32,44,58].includes(Number(b.spineW)) ? Number(b.spineW) : null,
      spineH: [0.7,0.83,0.96].includes(Number(b.spineH)) ? Number(b.spineH) : null,
      pubYear: parseInt(b.pubYear, 10) > 0 ? parseInt(b.pubYear, 10) : null,
      authorSort: typeof b.authorSort === "string" && b.authorSort.trim() ? b.authorSort.trim() : null,
      coverUrl: typeof b.coverUrl === "string" && /^https:\/\//.test(b.coverUrl) ? b.coverUrl : null,
      coverLocal: false,
      coverData: typeof b.coverData === "string" && /^data:image\//.test(b.coverData) ? b.coverData : null,
      createdAt: typeof b.createdAt === "string" ? b.createdAt : new Date().toISOString(),
      updatedAt: typeof b.updatedAt === "string" ? b.updatedAt : null,
    });
  }
  if (!out.length) throw new Error("Nel file non ho trovato libri.");
  if (data && data.authorPhotos && typeof data.authorPhotos === "object"){
    const p = {}; for (const [k, v] of Object.entries(data.authorPhotos)) if (typeof v === "string" && /^data:image\//.test(v)) p[k] = v;
    out.authorPhotos = p;
  }
  for (const f of ["authorPhotoUrls", "authorAuto", "authorPhotoSrc"]) if (data && data[f] && typeof data[f] === "object") out[f] = data[f];
  if (data && data.works && typeof data.works === "object"){
    const w = {}; for (const [k, v] of Object.entries(data.works)) if (typeof v === "string" && v.trim()) w[k] = v;
    out.works = w;
  }
  if (data && data.goals && typeof data.goals === "object"){
    const g = {}; for (const [y, n] of Object.entries(data.goals)){ const yy = parseInt(y, 10), nn = parseInt(n, 10); if (yy && nn > 0) g[yy] = nn; }
    out.goals = g;
  }
  if (data && Array.isArray(data.reading)){
    out.reading = data.reading.filter(r => r && typeof r.title === "string" && typeof r.author === "string").map(r => ({
      id: String(r.id || ("r" + Math.random().toString(36).slice(2,10))), title: r.title.trim(), author: r.author.trim(),
      pages: parseInt(r.pages, 10) || null, page: Math.max(0, parseInt(r.page, 10) || 0), color: null,
      notes: typeof r.notes === "string" ? r.notes : null, startedAt: typeof r.startedAt === "string" ? r.startedAt.slice(0,10) : null }));
  }
  if (data && Array.isArray(data.wish)){
    out.wish = data.wish.filter(w => w && typeof w.title === "string" && typeof w.author === "string").map(w => ({
      id: String(w.id || ("w" + Math.random().toString(36).slice(2,10))), title: w.title.trim(), author: w.author.trim(),
      notes: typeof w.notes === "string" ? w.notes : null, color: null, pages: null,
      createdAt: typeof w.createdAt === "string" ? w.createdAt : new Date().toISOString() }));
  }
  return out;
}

}

  // Le foto già salvate sul dispositivo non vengono MAI cancellate da un import:

  Object.keys(coverURLs).forEach(dropCoverURL);
  for (const b of books){
    let has = false; try { has = !!(await idb.get(b.id)); } catch(e){}
    if (has) b.coverLocal = true;
    else if (b.coverData){
      try { const blob = await (await fetch(b.coverData)).blob(); await idb.set(b.id, blob); b.coverLocal = true; } catch(e){ b.coverLocal = false; }
    } else if (b.coverLocal) b.coverLocal = false;
    delete b.coverData;
  }
  const goals = books.goals; delete books.goals;
  const works = books.works; delete books.works;
  const authorPhotos = books.authorPhotos; delete books.authorPhotos;
  const apu = books.authorPhotoUrls, aau = books.authorAuto, asr = books.authorPhotoSrc; delete books.authorPhotoUrls; delete books.authorAuto; delete books.authorPhotoSrc;
  const wish = books.wish; delete books.wish;
  const reading = books.reading; delete books.reading;
  state.books = books;
  try { persist(); } catch(e){ state.books = prev; openMenu(); $("mErr").textContent = errText(e); return; }
  if (goals) setMeta("goals", goals);
  if (works) setMeta("works", works);
  if (authorPhotos) for (const [k, v] of Object.entries(authorPhotos)){ try { if (!(await idb.get("author:" + k))) await idb.set("author:" + k, await (await fetch(v)).blob()); } catch(e){} }
  if (apu){ const cur = { ...authorUrlMap() }; for (const [k, v] of Object.entries(apu)){ if (typeof v !== "string" || !/^https:\/\//.test(v) || cur[k]) continue; let has = false; try { has = !!(await idb.get("author:" + k)); } catch(e){} if (!has) cur[k] = v; } setMeta("authorPhotoUrls", cur); }
  if (aau) setMeta("authorAuto", { ...aau, ...authorAutoMap() });
  if (asr) setMeta("authorPhotoSrc", { ...asr, ...(getMeta().authorPhotoSrc || {}) });
  Object.keys(aPhotoURLs).forEach(k => { if (aPhotoURLs[k].startsWith("blob:")) URL.revokeObjectURL(aPhotoURLs[k]); delete aPhotoURLs[k]; });
  fillAuthorNotes();
  if (wish && wish.length){
    for (const w of wish) if (!state.books.some(b => b.id === w.id))
      state.books.push({ id: w.id, title: w.title, author: w.author, year: null, list: "wish", notes: w.notes || null, createdAt: w.createdAt || new Date().toISOString() });
    try { persist(); } catch(e){}
  }
  if (reading && reading.length){
    for (const r of reading) if (!state.books.some(b => b.id === r.id))
      state.books.push({ id: r.id, title: r.title, author: r.author, year: null, reading: true, pages: r.pages || null, started: r.startedAt || null, notes: r.notes || null, createdAt: new Date().toISOString() });
    try { persist(); } catch(e){}
  }
  setMeta("lastBackupAt", new Date().toISOString());
  state.view = "all"; state.q = ""; state.author = ""; state.tag = ""; $("q").value = "";
  render();
  openMenu(`Importati ${books.length} libri.`);
}

function tagCounts(){
  const m = {};
  for (const b of state.books) for (const t of b.tags || []) m[t] = (m[t] || 0) + 1;
  return m;
}
function applyTagChange(from, to){
  const now = new Date().toISOString();
  const prev = state.books;
  let n = 0;
  state.books = state.books.map(b => {
    if (!(b.tags || []).includes(from)) return b;
    n++;
    const tags = [...new Set(b.tags.map(t => t === from ? to : t).filter(Boolean))];
    return { ...b, tags: tags.length ? tags : null, updatedAt: now };
  });
  try { persist(); } catch(e){ state.books = prev; throw e; }
  state.ftags = [...new Set(state.ftags.map(t => t === from ? to : t).filter(Boolean))];
  if (state.tag === from) state.tag = to || "";
  render();
  if (!$("formOv").hidden) drawTagPick();
  return n;
}
function openTagManager(){
  const counts = tagCounts();
  const tags = Object.keys(counts).sort((a,b) => a.localeCompare(b, "it"));
  const nb = c => `${c} ${c === 1 ? "libro" : "libri"}`;
  const row = t => `<div class="tmrow" data-t="${esc(t)}"><span class="tmname">${esc(t)}</span><span class="tmn">${nb(counts[t])}</span>
      <button type="button" class="btn ghost small" data-act="ren">Rinomina</button>
      <button type="button" class="btn ghost small" data-act="del">Elimina</button></div>`;
  $("menu").innerHTML = `
    <h3>Generi</h3>
    <p>Rinomina o elimina un genere: la modifica vale per tutti i libri che lo usano. I libri restano dove sono.</p>
    <div id="tmList">${tags.length ? tags.map(row).join("") : `<p>Non hai ancora creato generi.</p>`}</div>
    <div class="err" id="tmErr"></div>
    <div class="actions"><button type="button" class="btn" id="tmClose">Fatto</button></div>`;
  $("menuOv").hidden = false;
  $("tmClose").onclick = () => $("menuOv").hidden = true;
  $("tmList").onclick = async e => {
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const r = btn.closest(".tmrow"); const t = r.dataset.t;
    $("tmErr").textContent = "";
    if (btn.dataset.act === "ren"){
      r.innerHTML = `<input class="field" maxlength="30" autocomplete="off" value="${esc(t)}">
        <button type="button" class="btn ghost small" data-act="cancel">Annulla</button>
        <button type="button" class="btn small" data-act="save">Salva</button>`;
      const inp = r.querySelector("input"); inp.focus(); inp.select();
      inp.onkeydown = ev => { if (ev.key === "Enter"){ ev.preventDefault(); r.querySelector('[data-act="save"]').click(); } if (ev.key === "Escape"){ ev.stopPropagation(); openTagManager(); } };
      return;
    }
    if (btn.dataset.act === "cancel") return openTagManager();
    if (btn.dataset.act === "save"){
      const nv = cleanTag(r.querySelector("input").value);
      if (!nv){ $("tmErr").textContent = "Il nome del genere non può essere vuoto."; return; }
      if (nv === t) return openTagManager();
      const other = Object.keys(tagCounts()).find(x => x !== t && x.toLowerCase() === nv.toLowerCase());
      const target = other || nv;
      if (other && !(await askConfirm("Unire i generi?", `Esiste già "${other}": i libri con "${t}" passeranno a "${other}".`, "Unisci"))) return;
      try { applyTagChange(t, target); openTagManager(); } catch(err){ $("tmErr").textContent = errText(err); }
      return;
    }
    if (btn.dataset.act === "del"){
      const c = tagCounts()[t] || 0;
      if (!(await askConfirm(`Eliminare "${t}"?`, `Il genere verrà tolto da ${nb(c)}. I libri non vengono cancellati.`, "Elimina", true))) return;
      try { applyTagChange(t, null); openTagManager(); } catch(err){ $("tmErr").textContent = errText(err); }
    }
  };
}

/* ---------- Detail ---------- */
function fmtDate(d){ try { return new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day:"numeric", month:"long", year:"numeric" }); } catch(e){ return d; } }
let detailId = null, notesTimer = null;
function authorKey(a){ return norm(String(a || "").trim().replace(/\s+/g, " ")); }
// Note sull'autore condivise tra tutti i libri dello stesso autore
function authorNoteFor(author, excludeId){
  const k = authorKey(author);
  const src = state.books.filter(b => b.id !== excludeId && authorKey(b.author) === k && b.quotes)
    .sort((a,b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")))[0];
  return src ? src.quotes : null;
}
function shareAuthorNote(id){
  const b = state.books.find(x => x.id === id); if (!b) return 0;
  const k = authorKey(b.author); let n = 0;
  for (let i = 0; i < state.books.length; i++){
    const o = state.books[i];
    if (o.id !== id && authorKey(o.author) === k && (o.quotes || null) !== (b.quotes || null)){ state.books[i] = { ...o, quotes: b.quotes || null }; n++; }
  }
  if (n) persist();
  return n;
}
function fillAuthorNotes(){
  let changed = false;
  for (let i = 0; i < state.books.length; i++){
    const b = state.books[i];
    if (!b.quotes){ const q = authorNoteFor(b.author, b.id); if (q){ state.books[i] = { ...b, quotes: q }; changed = true; } }
  }
  if (changed) try { localStorage.setItem(KEY, JSON.stringify(state.books)); } catch(e){}
}
function saveTexts(id){
  const n = document.getElementById("dNotes"), q = document.getElementById("dQuotes"), my = document.getElementById("dMy");
  if (!n) return 0;
  const before = (state.books.find(x => x.id === id) || {}).quotes || null;
  updateBook(id, { notes: n.value.trim() || null, ...(q ? { quotes: q.value.trim() || null } : {}), ...(my ? { mynotes: my.value.trim() || null } : {}) });
  if (!q) return 0;
  const after = q.value.trim() || null;
  return before !== after ? shareAuthorNote(id) : 0;
}
function flushNotes(){
  if (!notesTimer) return;
  clearTimeout(notesTimer); notesTimer = null;
  if (detailId){ try { saveTexts(detailId); } catch(e){} }
}
function closeDetail(){ flushNotes(); $("detOv").hidden = true; detailId = null; render(); }
async function drawCover(b){

  if (detailId !== b.id) return;
  if (src){
    box.innerHTML = `<img class="cover" alt="Copertina di ${esc(b.title)}" src="${esc(src)}">`;
    const img = box.querySelector("img");
    await new Promise(res => {
      const t = setTimeout(res, 700);
      img.onload = () => { clearTimeout(t); res(); };
      img.onerror = () => { clearTimeout(t); box.innerHTML = `<div style="--row:180px;--s:1">${spineHTML(b)}</div>`; res(); };
      if (img.complete && img.naturalWidth) { clearTimeout(t); res(); }
    });
  } else {
    box.innerHTML = `<div style="--row:180px;--s:1">${spineHTML(b)}</div>`;
  }

}
function openDetail(id){
  const b = state.books.find(x => x.id === id); if (!b) return;

    ${b.list === "wish" ? `<button class="btn" id="dToRead" style="width:100%;margin-top:14px">Trovato! Spostalo in Da leggere</button>` : ""}
    ${b.list === "toread" ? `<button class="btn" id="dStart" style="width:100%;margin-top:14px">Inizio a leggerlo</button>` : ""}
    <label for="dNotes">Trama</label>
    <textarea class="field notesarea" id="dNotes" placeholder="Di cosa parla il libro…">${esc(b.notes || "")}</textarea>
    <div class="saved" id="dSavedNotes"></div>

  const autoGrow = ta => growKeep(ta, 58);

/* ---------- Scansione ISBN ---------- */
const ZXING_URL = "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js";
let zxingP = null, scanStream = null, scanLoop = null, scanDone = false;
function loadZXing(){
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return zxingP || (zxingP = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = ZXING_URL; sc.onload = () => res(window.ZXing); sc.onerror = () => { zxingP = null; rej(new Error("zxing")); }; document.head.appendChild(sc); }));
}
function zxHints(Z){ const h = new Map(); h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_E]); h.set(Z.DecodeHintType.TRY_HARDER, true); return h; }
function zxDecodeCanvas(Z, cv){
  try {
    const r = new Z.MultiFormatReader(); r.setHints(zxHints(Z));
    const src = new Z.HTMLCanvasElementLuminanceSource(cv);
    try { return r.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText(); } catch(e){}
    try { return r.decode(new Z.BinaryBitmap(new Z.GlobalHistogramBinarizer(src))).getText(); } catch(e){}
  } catch(e){}
  return null;
}
async function decodePhoto(f){
  const Z = await loadZXing();
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); }; im.onerror = rej; im.src = u; });
  const W = img.naturalWidth, H = img.naturalHeight, cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  const crops = [[0, 0, 1, 1], [0, .25, 1, .5], [0, .1, 1, .4], [0, .5, 1, .4], [.1, .3, .8, .4]];
  for (const maxSide of [1400, 2200, 900]) for (const rot of [0, 90]) for (const [x, y, w, hh] of crops){
    const sx = x * W, sy = y * H, sw = w * W, sh = hh * H, sc = Math.min(1, maxSide / Math.max(sw, sh));
    if (rot){ cv.width = Math.round(sh * sc); cv.height = Math.round(sw * sc); cx.save(); cx.translate(cv.width, 0); cx.rotate(Math.PI / 2); cx.drawImage(img, sx, sy, sw, sh, 0, 0, sw * sc, sh * sc); cx.restore(); }
    else { cv.width = Math.round(sw * sc); cv.height = Math.round(sh * sc); cx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height); }
    const c = zxDecodeCanvas(Z, cv); if (c) return c;
    await new Promise(r => setTimeout(r, 0));
  }
  return null;
}
async function openScanner(){
  scanDone = false;
  $("scanOv").hidden = false; $("scanCode").value = ""; $("scanMsg").textContent = "Avvio la fotocamera…";
  if (!navigator.onLine) $("scanMsg").textContent = "Senza internet posso leggere il codice ma non cercare il libro.";
  try {
    if ("BarcodeDetector" in window){
      const det = new BarcodeDetector({ formats: ["ean_13","upc_a","ean_8","upc_e"] });
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      const v = $("scanVideo"); v.srcObject = scanStream; await v.play();
      $("scanMsg").textContent = "";
      const tick = async () => { if (scanDone || $("scanOv").hidden) return; try { const r = await det.detect(v); if (r && r[0]) return onCode(r[0].rawValue); } catch(e){} scanLoop = setTimeout(tick, 250); };
      tick();
    } else {
      $("scanMsg").textContent = "Carico il lettore di codici…";
      const Z = await Promise.race([loadZXing(), new Promise((_, rej) => setTimeout(() => rej(new Error("zxing-timeout")), 15000))]);
      $("scanMsg").textContent = "Avvio la fotocamera…";
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      try { const tr = scanStream.getVideoTracks()[0]; const caps = tr.getCapabilities ? tr.getCapabilities() : {}; if (caps.focusMode && caps.focusMode.includes("continuous")) await tr.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch(e){}
      const v = $("scanVideo"); v.srcObject = scanStream; await v.play();
      $("scanMsg").textContent = "";
      const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
      let n = 0;
      const tick = () => {
        if (scanDone || $("scanOv").hidden) return;
        const vw = v.videoWidth, vh = v.videoHeight;
        if (vw && vh){
          const vert = (n++ % 3) === 2;
          const bw = vert ? vh * 0.45 : vw * 0.9, bh = vert ? vh * 0.9 : vh * 0.45;
          const sx = (vw - bw) / 2, sy = (vh - bh) / 2;
          const scale = Math.min(1, 1280 / Math.max(bw, bh));
          if (vert){ cv.width = Math.round(bh * scale); cv.height = Math.round(bw * scale); cx.save(); cx.translate(cv.width, 0); cx.rotate(Math.PI / 2); cx.drawImage(v, sx, sy, bw, bh, 0, 0, bw * scale, bh * scale); cx.restore(); }
          else { cv.width = Math.round(bw * scale); cv.height = Math.round(bh * scale); cx.drawImage(v, sx, sy, bw, bh, 0, 0, cv.width, cv.height); }
          const code = zxDecodeCanvas(Z, cv);
          if (code) return onCode(code);
        }
        scanLoop = setTimeout(tick, 120);
      };
      tick();
    }
  } catch(e){
    $("scanMsg").textContent = e && /zxing/.test(e.message || "") ? "Non riesco a caricare il lettore di codici: serve internet la prima volta. Puoi scrivere l'ISBN a mano." : "Non riesco ad aprire la fotocamera. Usa «Scatta una foto» oppure scrivi l'ISBN.";
  }
}
function stopScanner(){
  scanDone = true; clearTimeout(scanLoop);
  if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  const v = $("scanVideo"); try { v.pause(); v.srcObject = null; } catch(e){}
}
function closeScanner(){ stopScanner(); $("scanOv").hidden = true; }
$("scanClose").onclick = closeScanner;
$("scanGo").onclick = () => { const c = $("scanCode").value.replace(/[^\dXx]/g, ""); if (c.length === 10 || c.length === 13) onCode(c); else $("scanMsg").textContent = "L'ISBN ha 10 o 13 cifre."; };
$("scanCode").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("scanGo").click(); } });
$("scanPhoto").onclick = () => { $("barcodePhoto").value = ""; $("barcodePhoto").click(); };
$("barcodePhoto").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  $("scanMsg").textContent = "Leggo il codice dalla foto…";
  try {
    let code = null;
    if ("BarcodeDetector" in window){ try { const img = await createImageBitmap(f); const r = await new BarcodeDetector({ formats: ["ean_13","upc_a","ean_8","upc_e"] }).detect(img); code = r && r[0] && r[0].rawValue; } catch(e){} }
    if (!code) code = await decodePhoto(f);
    if (code) onCode(code); else throw 0;
  } catch(err){ $("scanMsg").textContent = "Non riesco a leggere il codice: riprova più vicino e con più luce, oppure scrivilo."; }
});
function isbn10to13(c){
  if (!/^\d{9}[\dX]$/i.test(c)) return c;
  const b = "978" + c.slice(0, 9); let sum = 0;
  for (let i = 0; i < 12; i++) sum += Number(b[i]) * (i % 2 ? 3 : 1);
  return b + ((10 - sum % 10) % 10);
}
async function onCode(code){
  if ($("scanMsg").dataset.busy) return;
  code = isbn10to13(String(code).replace(/[^\dXx]/g, "").toUpperCase());
  stopScanner();
  try { navigator.vibrate && navigator.vibrate(60); } catch(e){}
  if (!/^97[89]\d{10}$/.test(code)){ $("scanMsg").textContent = `Il codice ${code} non sembra un ISBN di un libro. Riprova o scrivilo a mano.`; return; }
  const same = state.books.find(b => b.isbn === code);
  $("scanMsg").dataset.busy = "1";
  $("scanMsg").textContent = `ISBN ${code}: cerco il libro…`;
  let info = null;
  try { info = await lookupIsbn(code); } catch(e){}
  delete $("scanMsg").dataset.busy;
  $("scanOv").hidden = true;
  if ($("formOv").hidden) openForm(null, currentView === "dacercare" ? { list: "toread" } : {});
  applyIsbn(code, info, same);
}
async function lookupIsbn(code){
  const out = { title: "", author: "", year: 0, pages: 0, desc: "", cover: "" };
  try {
    if (Date.now() >= googleBusyUntil){
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${code}`);
      if (r.status === 429) googleBusyUntil = Date.now() + 20000;
      else if (r.ok){
        const j = await r.json(); const v = j.items && j.items[0] && j.items[0].volumeInfo;
        if (v){
          out.title = [v.title, v.subtitle && v.title && v.title.length < 25 ? "" : ""].filter(Boolean).join("");
          out.author = (v.authors || []).join(", ");
          out.year = parseInt((v.publishedDate || "").slice(0, 4), 10) || 0;
          out.pages = v.pageCount || 0;
          out.desc = v.description ? String(v.description).replace(/<[^>]+>/g, "").trim() : "";
          const im = v.imageLinks; const t = im && (im.thumbnail || im.smallThumbnail);
          if (t) out.cover = t.replace(/^http:/, "https:").replace("&edge=curl", "").replace(/&zoom=\d/, "&zoom=1");
        }
      }
    }
  } catch(e){}
  if (!out.title || !out.author || !out.cover) try {
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${code}&format=json&jscmd=data`);
    if (r.ok){
      const j = await r.json(); const d = j["ISBN:" + code];
      if (d){
        out.title = out.title || d.title || "";
        out.author = out.author || (d.authors || []).map(a => a.name).join(", ");
        out.year = out.year || parseInt(String(d.publish_date || "").match(/\d{4}/)?.[0] || "", 10) || 0;
        out.pages = out.pages || d.number_of_pages || 0;
        if (!out.cover && d.cover) out.cover = d.cover.large || d.cover.medium || "";
      }
    }
  } catch(e){}
  if (!out.title) try {
    const r = await fetch(`https://itunes.apple.com/lookup?isbn=${code}&country=it`);
    if (r.ok){ const j = await r.json(); const it = j.results && j.results[0]; if (it){ out.title = it.trackName || ""; out.author = out.author || it.artistName || ""; if (!out.cover && it.artworkUrl100) out.cover = it.artworkUrl100.replace(/\/\d+x\d+bb\./, "/400x600bb."); } }
  } catch(e){}
  return out.title ? out : null;
}
async function applyIsbn(code, info, same){
  state.fIsbn = code;
  if (!info){
    $("fScanHint").textContent = `Non ho trovato il libro con ISBN ${code}: compila tu titolo e autore (l'ISBN resta salvato).`;
    return;
  }
  if (!$("fTitle").value.trim()) $("fTitle").value = info.title;
  if (!$("fAuthor").value.trim() && info.author){ $("fAuthor").value = info.author; if (!sortTouched) $("fAuthorSort").value = authorLabel(info.author); }
  if (!$("fNotes").value.trim() && info.desc) $("fNotes").value = info.desc;
  if (!$("fPages").value && info.pages) $("fPages").value = info.pages;
  if (info.cover && !state.pendingCover){ state.pendingCover = { type: "url", url: info.cover }; drawFormCover(); $("fCoverHint").textContent = "Copertina trovata con l'ISBN: se non è quella giusta usa «Cerca copertina online»."; }
  const dupB = same || state.books.find(b => norm(b.title) === norm(info.title) && authorKey(b.author) === authorKey(info.author || ""));
  $("fScanHint").textContent = (dupB ? `Attenzione: «${dupB.title}» è già nella libreria${dupB.reading ? " (in lettura)" : dupB.list ? " (in lista)" : dupB.year ? ` (letto nel ${dupB.year})` : ""}. ` : "") + `Trovato: «${info.title}». Controlla i dati prima di salvare.`;
  if (!$("fPub").value && info.author){
    $("fPubHint").textContent = "Cerco l'anno della prima edizione…";
    let y = 0; try { y = await findPubYear({ title: info.title, author: info.author }); } catch(e){}
    if (!$("fPub").value){
      if (y){ $("fPub").value = y; $("fPubHint").textContent = `Prima edizione: ${y} (controlla che sia giusto).`; }
      else if (info.year){ $("fPub").value = info.year; $("fPubHint").textContent = `Anno di questa edizione: ${info.year} (la prima edizione potrebbe essere precedente).`; }
      else $("fPubHint").textContent = "";
    }
  }
}
