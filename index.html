<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinili">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>I miei vinili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#16120f; --ink:#f3ead8; --muted:#b5a487; --line:#4a3d2e; --field:#2a221a; --accent:#d9a65a;
  --row:200px; --plank:16px; --s:1;
}
@media (max-width:640px){ :root{ --row:170px; --plank:13px; --s:.86; } }
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% -20%, #33281e 0%, transparent 60%), var(--wall);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none !important}
header{max-width:1100px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 6px calc(20px + env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.htitle{display:flex;align-items:center;gap:12px;min-width:0}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(30px,7vw,44px);margin:0;line-height:1;cursor:pointer}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:999px;border:1px solid #5d4c39;background:transparent;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn.back{font-size:28px;padding-bottom:3px}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#2a1d0f;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #5d4c39}
.btn.danger{background:#9e3a2e;color:#fff}
.btn.small{padding:8px 13px;font-size:13px}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px Inter,sans-serif;cursor:pointer;padding:4px}
.field{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font:15px Inter,sans-serif;outline:none;width:100%}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;line-height:1.5}

/* Home */
.home{max-width:1100px;margin:0 auto;padding:18px calc(20px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px;min-height:calc(100dvh - 110px - env(safe-area-inset-top))}
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(180deg,#271f17,#1e1812);border:1px solid #4a3d2e;border-radius:20px;padding:18px;color:var(--ink);cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card:hover{border-color:var(--accent)}
.card-art{flex:0 0 auto;width:120px;height:96px;border-radius:10px;background:#100c09;display:flex;align-items:flex-end;gap:1px;padding:0 8px;position:relative;overflow:hidden;border-bottom:8px solid #7a5230}
.card-art .spine{cursor:default}
.card-art .spine .txt{display:none}
.card-body{flex:1;min-width:0;overflow:hidden}
.card-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1;white-space:nowrap}
.card-sub{color:var(--muted);font-size:14px;margin-top:6px}
.chev{font-size:30px;color:var(--muted);flex:0 0 auto}
.card-art .disc{position:absolute;right:-14px;bottom:-12px;width:74px;height:74px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
@media (max-width:420px){ .card{gap:12px;padding:16px 14px} .card-art{width:96px;height:84px} .chev{font-size:26px} }
.credits{text-align:center;color:#8e7c62;font-size:12px;line-height:1.6;margin-top:auto;padding-top:24px}
.credits b{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-weight:600;color:var(--muted)}
.banner{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:#3a2a17;border:1px solid #8a6a3a;border-radius:16px;padding:14px 16px}
.banner b{display:block;font-size:15px}
.banner span{display:block;color:#e6cfa6;font-size:13px;margin-top:3px}
.banner-acts{display:flex;gap:8px;margin-left:auto}
#homeBanner:empty{display:none}

/* Controls */
.wrap{max-width:1100px;margin:0 auto;padding:4px calc(20px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0 4px}
.controls .search{flex:1 1 240px;position:relative}
.controls .search input{padding-left:38px}
.controls .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
.controls select{flex:0 1 220px}
.letters{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 4px}
.letters button{min-width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:0 6px}
.letters button:disabled{opacity:.25;cursor:default}
.sechead{display:flex;align-items:baseline;gap:12px;margin:22px 4px 10px}
.sechead h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;margin:0;font-weight:600}
.sechead span{color:var(--muted);font-size:14px}
.nores{color:var(--muted);text-align:center;margin:50px 0;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic}

/* Scaffale */
.case{position:relative;border-radius:6px;padding:14px 16px 0;border:14px solid #4e321c;border-bottom-width:0;border-image:linear-gradient(180deg,#6e4524,#4e321c 40%,#3d2716) 14;background:linear-gradient(90deg, rgba(0,0,0,.55), transparent 7%, transparent 93%, rgba(0,0,0,.55)),#110d0a;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.case::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-18px;height:18px;background:linear-gradient(180deg,#5e3b1f,#352010);border-radius:0 0 4px 4px}
.shelf{display:flex;flex-wrap:wrap;column-gap:1px;row-gap:var(--plank);padding-bottom:var(--plank);margin:0 -16px;padding-left:16px;padding-right:16px;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent var(--row),#94653a var(--row),#7a5230 calc(var(--row) + var(--plank)*.45),#553519 calc(var(--row) + var(--plank))),
  repeating-linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 16px,transparent var(--row),transparent calc(var(--row) + var(--plank)));
  background-position:0 0,0 calc(var(--row) + var(--plank))}
.slot{height:var(--row);display:flex;align-items:flex-end}
.empty-row{height:var(--row);display:flex;align-items:center;justify-content:center;width:100%;color:#8e7c62;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;text-align:center;padding:0 20px}
.spine{position:relative;width:calc(30px * var(--s));height:calc(var(--row) * .93);background:var(--c);color:var(--t);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:8px 0;
  box-shadow:inset 2px 0 2px rgba(255,255,255,.12), inset -3px 0 4px rgba(0,0,0,.4), 1px 0 2px rgba(0,0,0,.5);transition:transform .2s, filter .2s}
.spine::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:rgba(0,0,0,.25)}
.spine:hover,.spine:focus-visible{transform:translateY(-6px);filter:brightness(1.1);outline:none}
.spine .txt{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;gap:6px;align-items:center;max-height:100%;white-space:nowrap;overflow:hidden}
.spine .ar{font-size:calc(8px * var(--s) + 1px);letter-spacing:.8px;text-transform:uppercase;font-weight:600;opacity:.85;overflow:hidden;text-overflow:ellipsis;flex:0 1000 auto;min-height:0;max-height:45%}
.spine .al{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:calc(10px * var(--s) + 2px);overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-height:0}
.spine.new{animation:drop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.divider{position:relative;width:calc(24px * var(--s));height:calc(var(--row) * .98);background:linear-gradient(90deg,#d8c9a8,#c4b48f);border-radius:3px 3px 1px 1px;box-shadow:1px 0 3px rgba(0,0,0,.5);display:flex;justify-content:center;padding-top:6px;margin:0 2px}
.divider b{font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(17px * var(--s) + 2px);color:#2a1d0f;font-weight:700}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,7,4,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.sheet{background:#211a14;border:1px solid #4a3d2e;border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;padding:22px}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  #detOv{align-items:stretch}
  #detOv .sheet{border-radius:0;max-height:none;height:100%;padding-top:calc(18px + env(safe-area-inset-top));border:0}
}
.sheet h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:0 0 14px;line-height:1.1}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.sheet p{color:var(--muted);line-height:1.5;font-size:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.err{color:#e08a7c;font-size:13px;margin-top:10px}
.err:empty{display:none}
.ok{color:#9fc79a;font-size:13px;margin-top:10px}
.ok:empty{display:none}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.hint:empty{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.swatches .auto{width:auto;padding:0 10px;background:var(--field);color:var(--muted);font-size:12px;border:1px solid var(--line)}
.swatches .auto.on{border:2px solid var(--ink);color:var(--ink)}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{background:var(--field);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tagpick button.on{background:#5a3f1f;border-color:var(--accent);color:var(--ink)}
.fcover{display:flex;gap:14px;align-items:flex-start}
.fcover-prev{flex:0 0 auto;width:110px;height:110px;border-radius:4px;background:#100c09;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.fcover-prev img{width:100%;height:100%;object-fit:cover}
.fcover-acts{flex:1;display:flex;flex-direction:column;gap:8px}
.fcover-acts .btn{width:100%}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.picks button{padding:0;border:2px solid transparent;border-radius:6px;background:#2a221a;cursor:pointer;overflow:hidden;text-align:left;color:var(--ink)}
.picks button:hover{border-color:var(--accent)}
.picks img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.picks small{display:block;font-size:10px;line-height:1.25;padding:4px 5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Scheda disco */
.dtop{display:flex;gap:16px;align-items:flex-start}
.dcover{flex:0 0 auto;width:140px;height:140px;border-radius:4px;background:#100c09;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.dcover img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:420px){ .dcover{width:120px;height:120px} }
.dinfo{min-width:0}
.dinfo .art{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--muted);font-size:16px;text-align:left;text-decoration:underline;text-decoration-color:rgba(217,166,90,.45);text-underline-offset:4px}
.dinfo .yr{color:var(--muted);font-size:14px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip.tag{background:#3a2a17;border-color:#8a6a3a;color:#e6cfa6;cursor:pointer;font-size:11px;padding:3px 9px}
.chip.vin{display:inline-flex;align-items:center;gap:6px}
.chip.vin i{width:10px;height:10px;border-radius:50%;background:var(--vc);border:1px solid rgba(255,255,255,.3)}
.dsec{margin-top:20px}
.dsec h4{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px}
.dsec .box{background:var(--field);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;white-space:pre-wrap;text-align:justify}
.tracks{margin:0;padding:10px 14px 10px 38px;background:var(--field);border-radius:12px;font-size:13px;line-height:1.7}
.tracks li::marker{color:var(--muted);font-size:12px}
.tracks li.side{list-style:none;margin-left:-24px;color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-top:6px}
.bigact{width:100%;margin-top:16px}
.menu .item{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer;font-size:15px;font-weight:600}
.menu .item small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:3px}
.welcome{max-width:460px;margin:40px auto;text-align:center;background:#211a14;border:1px solid #4a3d2e;border-radius:18px;padding:26px 22px}
.welcome h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0 0 8px;font-weight:600}
.welcome p{color:var(--muted);line-height:1.5;margin:0 0 18px;font-size:15px}
.welcome .actions{justify-content:center}
.linkbtn.add{margin-left:auto;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="htitle">
    <button class="iconbtn back" id="backBtn" aria-label="Indietro" hidden>‹</button>
    <div>
      <h1 id="homeLink">I miei vinili</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
  </div>
  <div class="hbtns"><button class="iconbtn" id="menuBtn" aria-label="Menu">⋯</button><button class="btn" id="addBtn" hidden>+ Aggiungi disco</button></div>
</header>

<section id="viewHome" class="home">
  <div id="homeBanner"></div>
  <button class="card" id="goColl">
    <div class="card-art" id="homeColl"></div>
    <div class="card-body"><div class="card-title">Collezione</div><div class="card-sub" id="homeCollSub"></div></div>
    <span class="chev">›</span>
  </button>
  <button class="card" id="goLists">
    <div class="card-art" id="homeLists"></div>
    <div class="card-body"><div class="card-title" id="listsTitle">Wishlist <span style="color:var(--muted)">/</span> In arrivo</div><div class="card-sub" id="homeListsSub"></div></div>
    <span class="chev">›</span>
  </button>
  <footer class="credits" id="credits"></footer>
</section>

<section id="viewColl" class="wrap" hidden>
  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="field" id="q" type="search" placeholder="Cerca artista, album o canzone" autocomplete="off">
    </div>
    <select class="field" id="genreSel"><option value="">Tutti i generi</option></select>
  </div>
  <div class="letters" id="letters"></div>
  <div id="collMain"></div>
</section>

<section id="viewLists" class="wrap" hidden>
  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="field" id="lq" type="search" placeholder="Cerca nella wishlist e tra gli ordinati" autocomplete="off">
    </div>
  </div>
  <div id="listsMain"></div>
</section>

<!-- Scheda / modifica -->
<div class="overlay" id="formOv" hidden>
  <form class="sheet" id="form" novalidate>
    <h3 id="formTitle">Nuovo disco</h3>
    <label>Copertina</label>
    <div class="fcover">
      <div class="fcover-prev" id="fCoverPrev"></div>
      <div class="fcover-acts">
        <button type="button" class="btn ghost small" id="fSearch">Cerca online</button>
        <button type="button" class="btn ghost small" id="fPhoto">Carica foto</button>
        <button type="button" class="btn ghost small" id="fCoverDel">Togli copertina</button>
      </div>
    </div>
    <div class="hint" id="fHint"></div>
    <div class="picks" id="fPicks"></div>
    <label for="fArtist">Artista</label>
    <input class="field" id="fArtist" list="artistList" autocomplete="off">
    <datalist id="artistList"></datalist>
    <label for="fAlbum">Album</label>
    <input class="field" id="fAlbum" autocomplete="off">
    <label for="fYear">Anno</label>
    <input class="field" id="fYear" type="number" inputmode="numeric" min="1900" max="2100" placeholder="Es. 1991">
    <label>Genere</label>
    <div class="tagpick" id="fGenres"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input class="field" id="fGenreNew" placeholder="Nuovo genere, es. grunge" autocomplete="off" style="flex:1">
      <button type="button" class="btn ghost small" id="fGenreAdd">Aggiungi</button>
    </div>
    <label for="fVinyl">Colore vinile</label>
    <input class="field" id="fVinyl" list="vinylList" placeholder="Es. nero, rosso trasparente, splatter…" autocomplete="off">
    <datalist id="vinylList"><option value="Nero"><option value="Trasparente"><option value="Bianco"><option value="Rosso"><option value="Blu"><option value="Verde"><option value="Giallo"><option value="Arancione"><option value="Viola"><option value="Oro"><option value="Marmorizzato"><option value="Splatter"><option value="Picture disc"></datalist>
    <label for="fVinylNotes">Note vinile</label>
    <textarea class="field" id="fVinylNotes" rows="2" placeholder="Stampa, edizione limitata, numerazione, condizioni…"></textarea>
    <label for="fTracks">Tracklist</label>
    <textarea class="field" id="fTracks" rows="6" placeholder="Un brano per riga. Per dividere i lati scrivi «Lato A», «Lato B»…"></textarea>
    <label for="fNotes">Note</label>
    <textarea class="field" id="fNotes" rows="3" placeholder="Dove l'hai preso, ricordi, impressioni…"></textarea>
    <label>Colore della costina</label>
    <div class="swatches" id="fSw"></div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="fCancel">Annulla</button>
      <button type="submit" class="btn" id="fSave">Salva</button>
    </div>
  </form>
</div>

<div class="overlay" id="detOv" hidden><div class="sheet" id="det"></div></div>
<div class="overlay" id="menuOv" hidden><div class="sheet menu" id="menu"></div></div>
<div class="overlay" id="cfOv" hidden style="z-index:40">
  <div class="sheet" style="max-width:380px">
    <h3 id="cfTitle" style="font-size:24px"></h3>
    <p id="cfText" style="margin:0"></p>
    <div class="actions"><button class="btn ghost" id="cfNo">Annulla</button><button class="btn" id="cfYes">Conferma</button></div>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

<script>
(() => {
const APP_VERSION = "1.1";
const PALETTE = ["#1f1d1b","#7a2e2a","#23395b","#2f4a3a","#c49a3a","#e6d9bd","#2c5d63","#5a3550","#a2512b","#6b7b8c","#6b6a3a","#8c2f4b","#3d3a6b","#b8b2a3","#45604d","#9b6b43"];
const KEY = "vinili.discs.v1", META_KEY = "vinili.meta.v1";
const state = { discs: [], view: "home", q: "", genre: "", lq: "", newId: null, editing: null, formList: null, fgenres: [], color: "", pending: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function lum(hex){ const n = parseInt(hex.slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255; }

/* ---------- Dati ---------- */
function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
function getMeta(){ try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } }
function setMeta(k, v){ try { const m = getMeta(); if (v === null) delete m[k]; else m[k] = v; localStorage.setItem(META_KEY, JSON.stringify(m)); } catch(e){} }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state.discs)); } catch(e){ throw { code: "storage" }; } setMeta("lastChangeAt", new Date().toISOString()); }
function errText(e){ return e && e.code === "storage" ? "Non riesco a salvare sul dispositivo (memoria piena?)." : "Salvataggio non riuscito, riprova."; }
const collection = () => state.discs.filter(d => !d.list);
const listOf = k => state.discs.filter(d => d.list === k).sort((a,b) => String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
function sortName(a){ return norm(String(a || "").trim().replace(/^(the|i|il|lo|la|gli|le|les|los)\s+/i, "")); }
function letterOf(d){ const c = sortName(d.artist).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }
function discSort(a, b){ return sortName(a.artist).localeCompare(sortName(b.artist), "it") || (Number(a.year)||9999) - (Number(b.year)||9999) || norm(a.album).localeCompare(norm(b.album), "it"); }
function allGenres(){ const s = new Set(); for (const d of state.discs) for (const g of d.genres || []) s.add(g); return [...s].sort((a,b) => a.localeCompare(b, "it")); }

/* ---------- Copertine (IndexedDB) ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("vinili", 1); r.onupgradeneeded = () => r.result.createObjectStore("covers"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("covers", mode); const q = fn(t.objectStore("covers")); t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return { get: id => run("readonly", s => s.get(id)), set: (id, v) => run("readwrite", s => s.put(v, id)), del: id => run("readwrite", s => s.delete(id)), clear: () => run("readwrite", s => s.clear()) };
})();
const coverURLs = {};
async function coverSrc(d){
  if (d.coverLocal){
    if (coverURLs[d.id]) return coverURLs[d.id];
    try { const b = await idb.get(d.id); if (b){ coverURLs[d.id] = URL.createObjectURL(b); return coverURLs[d.id]; } } catch(e){}
  }
  return d.coverUrl || null;
}
function dropCover(id){ if (coverURLs[id]){ URL.revokeObjectURL(coverURLs[id]); delete coverURLs[id]; } }
async function photoToBlob(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(900, side);
    const c = document.createElement("canvas"); c.width = out; c.height = out;
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
// Ricerca online: Apple Music (copertina, anno, genere, tracklist)
async function searchAlbums(artist, album){
  const term = `${artist} ${album}`.trim();
  const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=album&country=it&limit=12`);
  if (!r.ok) return [];
  const j = await r.json();
  return (j.results || []).filter(x => x.artworkUrl100).map(x => ({
    id: x.collectionId, album: x.collectionName, artist: x.artistName, year: parseInt((x.releaseDate || "").slice(0,4), 10) || null,
    genre: x.primaryGenreName || null, art: x.artworkUrl100.replace(/\/\d+x\d+bb\./, "/600x600bb."), thumb: x.artworkUrl100.replace(/\/\d+x\d+bb\./, "/200x200bb.")
  }));
}
async function fetchTracks(collectionId){
  try {
    const r = await fetch(`https://itunes.apple.com/lookup?id=${collectionId}&entity=song&country=it`);
    const j = await r.json();
    const songs = (j.results || []).filter(x => x.wrapperType === "track").sort((a,b) => (a.discNumber - b.discNumber) || (a.trackNumber - b.trackNumber));
    const multi = new Set(songs.map(s => s.discNumber)).size > 1;
    const out = []; let last = null;
    for (const s of songs){ if (multi && s.discNumber !== last){ out.push(`Disco ${s.discNumber}`); last = s.discNumber; } out.push(s.trackName); }
    return out.join("\n");
  } catch(e){ return ""; }
}
async function storeCoverFromUrl(id, url){
  dropCover(id);
  try { const r = await fetch(url, { mode: "cors" }); if (!r.ok) throw 0; const b = await r.blob(); if (!/^image\//.test(b.type)) throw 0; await idb.set(id, b); return { coverUrl: url, coverLocal: true }; }
  catch(e){ try { await idb.del(id); } catch(_){} const im = new Image(); im.src = url; return { coverUrl: url, coverLocal: false }; }
}

/* ---------- Costine ---------- */
function spineHTML(d, extra = ""){
  const h = hash((d.artist || "") + "|" + (d.album || ""));
  const color = d.color || PALETTE[h % PALETTE.length];
  const light = lum(color) > 0.6;
  return `<button class="spine ${extra}" data-id="${esc(d.id)}" title="${esc(d.artist)} — ${esc(d.album)}" style="--c:${color};--t:${light ? "#2a2018" : "#f4ead6"}">
    <span class="txt"><span class="ar">${esc(d.artist)}</span><span class="al">${esc(d.album)}</span></span></button>`;
}
const spineSpan = d => spineHTML(d).trim().replace(/^<button/, "<span").replace(/<\/button>$/, "</span>");
const DISC_SVG = `<svg class="disc" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#0b0b0b"/>${[42,36,30,24].map(r => `<circle cx="50" cy="50" r="${r}" fill="none" stroke="#262626" stroke-width="1"/>`).join("")}<circle cx="50" cy="50" r="15" fill="#d9a65a"/><circle cx="50" cy="50" r="2.5" fill="#0b0b0b"/><path d="M20 30 A36 36 0 0 1 40 15" stroke="#fff" stroke-opacity=".18" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- Pagine ---------- */
function showView(v, push = true){
  if (!["home","collezione","liste"].includes(v)) v = "home";
  state.view = v;
  $("viewHome").hidden = v !== "home"; $("viewColl").hidden = v !== "collezione"; $("viewLists").hidden = v !== "liste";
  $("backBtn").hidden = v === "home"; $("addBtn").hidden = v === "home";
  if (push){ const h = v === "home" ? "" : "#" + v; if (location.hash !== h) history.pushState(null, "", h || location.pathname); }
  window.scrollTo(0, 0); render();
}
window.addEventListener("popstate", () => showView((location.hash || "").slice(1), false));
$("goColl").onclick = () => showView("collezione");
$("goLists").onclick = () => showView("liste");
$("backBtn").onclick = () => showView("home");
$("homeLink").onclick = () => showView("home");
$("addBtn").onclick = () => openForm(null, state.view === "liste" ? "wish" : null);

function render(){
  const coll = collection();
  $("sub").textContent = coll.length ? `${coll.length} ${coll.length === 1 ? "disco" : "dischi"} in collezione` : "La collezione ti aspetta";
  renderHome(); renderColl(); renderLists();
}
function renderHome(){
  const coll = collection().sort(discSort), wish = listOf("wish"), inc = listOf("incoming");
  const deco = PALETTE.slice(0, 9).map((c, i) => ({ id: "d" + i, artist: "", album: "", color: c }));
  $("homeColl").innerHTML = (coll.length ? coll.slice(0, 11) : deco).map(d => `<div style="--row:78px;--s:.32">${spineSpan(d)}</div>`).join("");
  $("homeCollSub").textContent = coll.length ? `${coll.length} ${coll.length === 1 ? "disco" : "dischi"} in ordine alfabetico` : "Aggiungi il tuo primo disco";
  $("homeLists").innerHTML = [...wish, ...inc, ...deco].slice(0, 7).map(d => `<div style="--row:78px;--s:.32">${spineSpan(d)}</div>`).join("") + DISC_SVG;
  $("homeListsSub").textContent = (wish.length || inc.length) ? `${wish.length} in wishlist · ${inc.length} in arrivo` : "Dischi da comprare e già ordinati";
  $("homeBanner").innerHTML = bannerHTML();
  requestAnimationFrame(() => { const t = $("listsTitle"); if (!t.offsetParent) return; let fs = 30; t.style.fontSize = fs + "px"; while (t.scrollWidth > t.clientWidth && fs > 14){ fs -= .5; t.style.fontSize = fs + "px"; } });
}
function matchQ(d, q){ if (!q) return true; q = norm(q); return norm(d.artist).includes(q) || norm(d.album).includes(q) || norm(d.tracks).includes(q) || (d.genres || []).some(g => norm(g).includes(q)); }
function renderColl(){
  const genres = allGenres();
  if (state.genre && !genres.includes(state.genre)) state.genre = "";
  $("genreSel").innerHTML = `<option value="">Tutti i generi</option>` + genres.map(g => `<option ${g === state.genre ? "selected" : ""}>${esc(g)}</option>`).join("");
  $("genreSel").hidden = !genres.length;
  $("artistList").innerHTML = [...new Set(state.discs.map(d => d.artist))].sort().map(a => `<option value="${esc(a)}">`).join("");
  const all = collection();
  const list = all.filter(d => matchQ(d, state.q) && (!state.genre || (d.genres || []).includes(state.genre))).sort(discSort);
  const present = new Set(list.map(letterOf));
  $("letters").innerHTML = "#ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => `<button data-l="${l}" ${present.has(l) ? "" : "disabled"}>${l}</button>`).join("");
  $("letters").hidden = list.length < 15;
  if (!all.length){
    $("collMain").innerHTML = `<div class="welcome"><h2>La tua collezione</h2><p>Aggiungi il primo disco. Gli scaffali si ordinano da soli in ordine alfabetico per artista.</p><div class="actions"><button class="btn ghost" id="wImport">Importa backup</button><button class="btn" id="wAdd">Aggiungi disco</button></div></div>`;
    return;
  }
  if (!list.length){ $("collMain").innerHTML = `<p class="nores">Nessun disco corrisponde alla ricerca</p>`; return; }
  let html = "", last = null;
  for (const d of list){
    const l = letterOf(d);
    if (l !== last){ html += `<div class="slot" id="L-${l}"><div class="divider"><b>${l}</b></div></div>`; last = l; }
    html += `<div class="slot">${spineHTML(d, d.id === state.newId ? "new" : "")}</div>`;
  }
  $("collMain").innerHTML = `<div class="sechead"><h2>Collezione</h2><span>${state.q || state.genre ? `${list.length} di ${all.length}` : `${all.length} ${all.length === 1 ? "disco" : "dischi"}`}</span></div><div class="case"><div class="shelf">${html}</div></div>`;
  state.newId = null;
}
function renderLists(){
  const q = state.lq;
  const sec = (k, label, empty) => {
    const all = listOf(k), list = all.filter(d => matchQ(d, q));
    return `<div class="sechead"><h2>${label}</h2><span>${q ? `${list.length} di ${all.length}` : `${all.length} ${all.length === 1 ? "disco" : "dischi"}`}</span><button class="linkbtn add" data-add="${k}">+ Aggiungi</button></div>
      <div class="case"><div class="shelf">${list.length ? list.map(d => `<div class="slot">${spineHTML(d, d.id === state.newId ? "new" : "")}</div>`).join("") : `<div class="empty-row">${q ? "Nessun disco corrisponde" : empty}</div>`}</div></div>`;
  };
  $("listsMain").innerHTML = sec("wish", "Wishlist", "I dischi che vorresti comprare") + sec("incoming", "In arrivo", "I dischi ordinati e non ancora arrivati");
}
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderColl(); });
$("lq").addEventListener("input", e => { state.lq = e.target.value.trim(); renderLists(); });
$("genreSel").addEventListener("change", e => { state.genre = e.target.value; renderColl(); });
$("letters").addEventListener("click", e => { const b = e.target.closest("button[data-l]"); if (!b || b.disabled) return; const el = $("L-" + b.dataset.l); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" }); });
$("collMain").addEventListener("click", e => {
  if (e.target.id === "wAdd") return openForm(null, null);
  if (e.target.id === "wImport"){ $("importFile").value = ""; return $("importFile").click(); }
  const s = e.target.closest(".spine"); if (s) openDetail(s.dataset.id);
});
$("listsMain").addEventListener("click", e => {
  const a = e.target.closest("[data-add]"); if (a) return openForm(null, a.dataset.add);
  const s = e.target.closest(".spine"); if (s) openDetail(s.dataset.id);
});

/* ---------- Conferma ---------- */
function askConfirm(title, text, ok = "Conferma", danger = false){
  return new Promise(resolve => {
    $("cfTitle").textContent = title; $("cfText").textContent = text || "";
    const y = $("cfYes"), n = $("cfNo"), ov = $("cfOv");
    y.textContent = ok; y.className = danger ? "btn danger" : "btn";
    const done = v => { ov.hidden = true; y.onclick = n.onclick = ov.onclick = null; resolve(v); };
    y.onclick = () => done(true); n.onclick = () => done(false); ov.onclick = e => { if (e.target === ov) done(false); };
    ov.hidden = false;
  });
}

/* ---------- Scheda ---------- */
function tracksHTML(t){
  const lines = String(t || "").split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) return "";
  let n = 0;
  return `<ol class="tracks">${lines.map(l => /^(lato|side|disco|disc)\s+\S+$/i.test(l) ? `<li class="side">${esc(l)}</li>` : `<li value="${++n}">${esc(l.replace(/^\d+[\.\)]\s*/, ""))}</li>`).join("")}</ol>`;
}
async function openDetail(id){
  const d = state.discs.find(x => x.id === id); if (!d) return;
  const status = d.list === "wish" ? "In wishlist" : d.list === "incoming" ? "In arrivo" : null;
  $("det").innerHTML = `
    <div class="dtop">
      <div class="dcover" id="dCover">${spineSpan(d)}</div>
      <div class="dinfo">
        <h3 style="margin-bottom:8px">${esc(d.album)}</h3>
        <button class="art" id="dArtist">${esc(d.artist)}</button>
        <div class="yr">${d.year ? `Uscito nel ${d.year}` : "Anno non indicato"}</div>
        ${d.rating ? `<div class="yr" style="color:var(--accent);letter-spacing:2px">${"★".repeat(Math.floor(d.rating))}${d.rating % 1 ? "½" : ""}<span style="color:#5d4c39">${"★".repeat(5 - Math.ceil(d.rating))}</span></div>` : ""}
        <div class="chips">
          ${status ? `<span class="chip">${status}</span>` : ""}
          ${d.vinyl ? `<span class="chip vin" style="--vc:${vinylDot(d.vinyl)}"><i></i>${esc(d.vinyl)}</span>` : ""}
          ${(d.genres || []).map(g => `<button class="chip tag" data-g="${esc(g)}">${esc(g)}</button>`).join("")}
        </div>
      </div>
    </div>
    ${d.list === "wish" ? `<button class="btn bigact" id="dOrder">Ordinato! Sposta in In arrivo</button><button class="btn ghost bigact" style="margin-top:8px" id="dGot">Ce l'ho già: mettilo in collezione</button>` : ""}
    ${d.list === "incoming" ? `<button class="btn bigact" id="dGot">Arrivato! Mettilo in collezione</button>` : ""}
    ${d.tracks ? `<div class="dsec"><h4>Tracklist</h4>${tracksHTML(d.tracks)}</div>` : ""}
    ${d.vinylNotes ? `<div class="dsec"><h4>Note vinile</h4><div class="box">${esc(d.vinylNotes)}</div></div>` : ""}
    ${d.notes ? `<div class="dsec"><h4>Note</h4><div class="box">${esc(d.notes)}</div></div>` : ""}
    <div class="actions">
      <button class="btn ghost" id="dDel">Elimina</button>
      <button class="btn ghost" id="dEdit">Modifica</button>
      <button class="btn" id="dClose">Chiudi</button>
    </div>`;
  const src = await coverSrc(d);
  if (src) await new Promise(res => { $("dCover").innerHTML = `<img src="${esc(src)}" alt="">`; const im = $("dCover").querySelector("img"); const t = setTimeout(res, 700); im.onload = () => { clearTimeout(t); res(); }; im.onerror = () => { clearTimeout(t); $("dCover").innerHTML = spineSpan(d); res(); }; });
  $("detOv").hidden = false; $("det").scrollTop = 0;
  $("dClose").onclick = () => { $("detOv").hidden = true; };
  $("dEdit").onclick = () => { $("detOv").hidden = true; openForm(d, d.list || null); };
  $("dArtist").onclick = () => { $("detOv").hidden = true; state.q = d.artist; $("q").value = d.artist; state.genre = ""; showView("collezione"); };
  $("det").querySelectorAll(".chip.tag").forEach(c => c.onclick = () => { $("detOv").hidden = true; state.genre = c.dataset.g; state.q = ""; $("q").value = ""; showView("collezione"); });
  $("dDel").onclick = async () => {
    if (!(await askConfirm("Eliminare il disco?", `«${d.album}» di ${d.artist} verrà eliminato.`, "Elimina", true))) return;
    state.discs = state.discs.filter(x => x.id !== id); dropCover(id); try { await idb.del(id); persist(); } catch(e){}
    $("detOv").hidden = true; render();
  };
  if ($("dOrder")) $("dOrder").onclick = () => moveTo(id, "incoming");
  if ($("dGot")) $("dGot").onclick = () => moveTo(id, null);
}
function vinylDot(v){
  const n = norm(v);
  const map = [["trasparen","rgba(255,255,255,.25)"],["bianc","#f2efe8"],["ross","#b3261e"],["blu","#2a4f9e"],["azzurr","#5aa0d8"],["verd","#2f8a4a"],["giall","#e6c229"],["arancio","#e07a1f"],["viola","#7b3fa0"],["rosa","#e58fb0"],["oro","#c9a03a"],["argent","#b8b8b8"],["marmo","linear-gradient(45deg,#7a2e2a,#e6d9bd)"],["splatter","conic-gradient(#e6c229,#b3261e,#2a4f9e,#e6c229)"],["picture","conic-gradient(#d9a65a,#5a3550,#2c5d63,#d9a65a)"]];
  for (const [k,c] of map) if (n.includes(k)) return c;
  return "#111";
}
$("detOv").addEventListener("click", e => { if (e.target.id === "detOv") $("detOv").hidden = true; });
async function moveTo(id, to){
  const d = state.discs.find(x => x.id === id); if (!d) return;
  const msg = to === "incoming" ? ["Spostare in In arrivo?", `«${d.album}» risulta ordinato e in attesa di consegna.`, "Sposta"] : ["Mettere in collezione?", `«${d.album}» va sullo scaffale, al suo posto in ordine alfabetico.`, "Conferma"];
  if (!(await askConfirm(...msg))) return;
  const i = state.discs.findIndex(x => x.id === id);
  const nd = { ...d, updatedAt: new Date().toISOString() };
  if (to) nd.list = to; else delete nd.list;
  state.discs[i] = nd; state.newId = id;
  try { persist(); } catch(e){}
  $("detOv").hidden = true;
  if (!to) showView("collezione"); else render();
}

/* ---------- Modulo ---------- */
function drawGenres(){
  const all = [...new Set([...allGenres(), ...state.fgenres])].sort((a,b) => a.localeCompare(b, "it"));
  $("fGenres").innerHTML = all.length ? all.map(g => `<button type="button" data-g="${esc(g)}" class="${state.fgenres.includes(g) ? "on" : ""}">${esc(g)}</button>`).join("") : `<span class="hint" style="margin:0">Nessun genere ancora: scrivine uno qui sotto.</span>`;
}
$("fGenres").onclick = e => { const b = e.target.closest("button[data-g]"); if (!b) return; const g = b.dataset.g; state.fgenres = state.fgenres.includes(g) ? state.fgenres.filter(x => x !== g) : [...state.fgenres, g]; drawGenres(); };
function addGenre(){ const g = $("fGenreNew").value.replace(/\s+/g, " ").trim().slice(0, 30); if (!g) return; const ex = allGenres().find(x => x.toLowerCase() === g.toLowerCase()) || g; if (!state.fgenres.includes(ex)) state.fgenres.push(ex); $("fGenreNew").value = ""; drawGenres(); }
$("fGenreAdd").onclick = addGenre;
$("fGenreNew").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); addGenre(); } });
function drawSwatches(){ $("fSw").innerHTML = `<button type="button" class="auto ${!state.color ? "on" : ""}" data-c="">Auto</button>` + PALETTE.map(c => `<button type="button" data-c="${c}" class="${state.color === c ? "on" : ""}" style="background:${c}"></button>`).join(""); }
$("fSw").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.color = b.dataset.c; drawSwatches(); drawFormCover(); };
async function drawFormCover(){
  const prev = state.editing ? state.discs.find(d => d.id === state.editing) : null;
  const p = state.pending;
  let src = p ? (p.type === "remove" ? null : p.url) : (prev ? await coverSrc(prev) : null);
  $("fCoverPrev").innerHTML = src ? `<img src="${esc(src)}" alt="">` : `<div style="--row:110px;--s:1">${spineSpan({ id: "x", artist: $("fArtist").value || "Artista", album: $("fAlbum").value || "Album", color: state.color || null })}</div>`;
  $("fCoverDel").hidden = !src;
}
function openForm(d, list){
  state.editing = d ? d.id : null; state.formList = d ? (d.list || null) : list;
  state.pending = null; state.fgenres = [...(d?.genres || [])]; state.color = d?.color || "";
  $("formTitle").textContent = d ? "Modifica disco" : list === "wish" ? "Nuovo disco in wishlist" : list === "incoming" ? "Nuovo disco in arrivo" : "Nuovo disco";
  $("fSave").textContent = d ? "Salva" : list ? "Aggiungi alla lista" : "Metti in collezione";
  $("fArtist").value = d?.artist || ""; $("fAlbum").value = d?.album || ""; $("fYear").value = d?.year || "";
  $("fVinyl").value = d?.vinyl || ""; $("fVinylNotes").value = d?.vinylNotes || ""; $("fTracks").value = d?.tracks || ""; $("fNotes").value = d?.notes || "";
  $("fHint").textContent = ""; $("fPicks").innerHTML = ""; $("fErr").textContent = "";
  drawGenres(); drawSwatches(); drawFormCover();
  $("formOv").hidden = false; $("form").scrollTop = 0;
}
$("fCancel").onclick = () => { $("formOv").hidden = true; };
["fArtist","fAlbum"].forEach(id => $(id).addEventListener("input", () => { if (!state.pending) drawFormCover(); }));
$("fSearch").onclick = async () => {
  const artist = $("fArtist").value.trim(), album = $("fAlbum").value.trim();
  $("fPicks").innerHTML = "";
  if (!artist && !album){ $("fHint").textContent = "Scrivi prima artista e album."; return; }
  if (!navigator.onLine){ $("fHint").textContent = "Serve la connessione a internet. Puoi usare una foto."; return; }
  $("fHint").textContent = "Cerco…";
  let res = []; try { res = await searchAlbums(artist, album); } catch(e){}
  if (!res.length){ $("fHint").textContent = "Non ho trovato niente. Puoi fotografare la copertina con «Carica foto»."; return; }
  $("fHint").textContent = "Tocca l'album giusto: prendo copertina e, se mancano, anno, genere e tracklist.";
  state.results = res;
  $("fPicks").innerHTML = res.map((r, i) => `<button type="button" data-i="${i}"><img src="${esc(r.thumb)}" alt="" loading="lazy"><small>${esc(r.album)}${r.year ? " · " + r.year : ""}</small></button>`).join("");
};
$("fPicks").onclick = async e => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const r = state.results[Number(b.dataset.i)];
  state.pending = { type: "url", url: r.art };
  $("fPicks").innerHTML = ""; $("fHint").textContent = "Copertina scelta. Recupero i dati…";
  if (!$("fYear").value && r.year) $("fYear").value = r.year;
  if (!$("fAlbum").value.trim()) $("fAlbum").value = r.album;
  if (!$("fArtist").value.trim()) $("fArtist").value = r.artist;
  if (r.genre && !state.fgenres.length){ const ex = allGenres().find(x => x.toLowerCase() === r.genre.toLowerCase()) || r.genre; state.fgenres = [ex]; drawGenres(); }
  if (!$("fTracks").value.trim()){ const t = await fetchTracks(r.id); if (t) $("fTracks").value = t; }
  $("fHint").textContent = "Fatto: controlla i dati e premi Salva.";
  drawFormCover();
};
$("fPhoto").onclick = () => { $("photoFile").value = ""; $("photoFile").click(); };
$("photoFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { const blob = await photoToBlob(f); state.pending = { type: "blob", blob, url: URL.createObjectURL(blob) }; $("fHint").textContent = "Foto scelta: verrà salvata quando premi Salva."; $("fPicks").innerHTML = ""; drawFormCover(); }
  catch(err){ $("fHint").textContent = "Non sono riuscita a usare questa immagine."; }
});
$("fCoverDel").onclick = () => { state.pending = { type: "remove" }; $("fHint").textContent = "La copertina verrà tolta quando premi Salva."; drawFormCover(); };
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const artist = $("fArtist").value.trim(), album = $("fAlbum").value.trim();
  if (!artist || !album){ $("fErr").textContent = "Artista e album sono obbligatori."; return; }
  const year = parseInt($("fYear").value, 10) || null;
  const prev = state.editing ? state.discs.find(d => d.id === state.editing) : null;
  if (prev && !(await askConfirm("Salvare le modifiche?", `Aggiorno «${album}».`, "Salva"))) return;
  const id = prev ? prev.id : "v" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const data = { ...(prev || {}), id, artist, album, year, genres: state.fgenres.length ? [...state.fgenres] : null,
    vinyl: $("fVinyl").value.trim() || null, vinylNotes: $("fVinylNotes").value.trim() || null,
    tracks: $("fTracks").value.trim() || null, notes: $("fNotes").value.trim() || null, color: state.color || null,
    createdAt: prev?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
  if (state.formList) data.list = state.formList; else delete data.list;
  const p = state.pending;
  try {
    if (p){
      dropCover(id);
      if (p.type === "url") Object.assign(data, await storeCoverFromUrl(id, p.url));
      else if (p.type === "blob"){ await idb.set(id, p.blob); data.coverUrl = null; data.coverLocal = true; }
      else { try { await idb.del(id); } catch(_){} data.coverUrl = null; data.coverLocal = false; }
    }
    if (prev) state.discs[state.discs.findIndex(d => d.id === id)] = data; else { state.discs.push(data); state.newId = id; }
    persist();
    $("formOv").hidden = true; state.pending = null;
    render();
    if (!prev && !state.formList && state.view !== "collezione") showView("collezione");
  } catch(err){ $("fErr").textContent = errText(err); }
});

/* ---------- Backup ---------- */
async function shareOrDownload(file, okMsg){
  try { if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: file.name }); return okMsg; } }
  catch(e){ if (e && e.name === "AbortError") return ""; }
  const url = URL.createObjectURL(file); const a = document.createElement("a"); a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
  return okMsg;
}
async function exportBackup(){
  const discs = [];
  for (const d of state.discs){
    const c = { ...d };
    if (d.coverLocal){ try { const b = await idb.get(d.id); if (b) c.coverData = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); } catch(e){} }
    discs.push(c);
  }
  const file = new File([JSON.stringify({ app: "vinili", version: 1, exportedAt: new Date().toISOString(), discs })], `vinili-backup-${new Date().toISOString().slice(0,10)}.json`, { type: "application/json" });
  const r = await shareOrDownload(file, "Backup pronto: salvalo su File o iCloud Drive.");
  if (r){ setMeta("lastBackupAt", new Date().toISOString()); setMeta("snoozeUntil", null); }
  return r;
}
async function exportCSV(){
  const cols = ["Artista","Album","Anno","Genere","Colore vinile","Note vinile","Tracklist","Note","Stato"];
  const rows = [...state.discs].sort(discSort).map(d => [d.artist, d.album, d.year || "", (d.genres || []).join(", "), d.vinyl || "", d.vinylNotes || "", (d.tracks || "").split("\n").join(" / "), d.notes || "", d.list === "wish" ? "Wishlist" : d.list === "incoming" ? "In arrivo" : "Collezione"]);
  const cell = v => { const t = String(v ?? ""); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = "﻿" + [cols, ...rows].map(r => r.map(cell).join(";")).join("\r\n");
  return shareOrDownload(new File([csv], `vinili-${new Date().toISOString().slice(0,10)}.csv`, { type: "text/csv" }), "File pronto: aprilo con Excel o Numbers.");
}
function parseBackup(text){
  let data; try { data = JSON.parse(text); } catch(e){ throw new Error("Il file non è un backup valido."); }
  const list = Array.isArray(data) ? data : data && data.discs;
  if (!Array.isArray(list)) throw new Error("Il file non contiene una collezione di vinili.");
  const out = list.filter(d => d && typeof d.artist === "string" && typeof d.album === "string").map(d => ({
    id: String(d.id || "v" + Math.random().toString(36).slice(2,10)), artist: d.artist.trim(), album: d.album.trim(), year: parseInt(d.year, 10) || null,
    genres: Array.isArray(d.genres) ? d.genres.filter(g => typeof g === "string").slice(0, 20) : null,
    vinyl: typeof d.vinyl === "string" ? d.vinyl : null, vinylNotes: typeof d.vinylNotes === "string" ? d.vinylNotes : null,
    tracks: typeof d.tracks === "string" ? d.tracks : null, notes: typeof d.notes === "string" ? d.notes : null,
    color: typeof d.color === "string" && /^#[0-9a-f]{6}$/i.test(d.color) ? d.color : null,
    coverUrl: typeof d.coverUrl === "string" && /^https:\/\//.test(d.coverUrl) ? d.coverUrl : null, coverLocal: false,
    coverData: typeof d.coverData === "string" && /^data:image\//.test(d.coverData) ? d.coverData : null,
    ...(d.list === "wish" || d.list === "incoming" ? { list: d.list } : {}),
    ...(Number(d.rating) > 0 ? { rating: Math.round(Number(d.rating) * 2) / 2 } : {}),
    ...(d.discogsId ? { discogsId: String(d.discogsId) } : {}),
    createdAt: typeof d.createdAt === "string" ? d.createdAt : new Date().toISOString() }));
  if (!out.length) throw new Error("Nel file non ho trovato dischi.");
  return out;
}
async function applyImport(discs){
  $("menu").innerHTML = `<h3>Importo…</h3><p>Sistemo ${discs.length} dischi sugli scaffali.</p>`;
  try { await idb.clear(); } catch(e){}
  Object.keys(coverURLs).forEach(dropCover);
  for (const d of discs){ if (d.coverData){ try { await idb.set(d.id, await (await fetch(d.coverData)).blob()); d.coverLocal = true; } catch(e){} } delete d.coverData; }
  state.discs = discs; try { persist(); } catch(e){}
  setMeta("lastBackupAt", new Date().toISOString());
  render(); openMenu(`Importati ${discs.length} dischi.`);
}
$("importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if ($("menuOv").hidden) openMenu();
  let discs; try { discs = parseBackup(await f.text()); } catch(err){ $("mErr").textContent = err.message; return; }
  if (state.discs.length && !(await askConfirm("Importare il backup?", `Il file contiene ${discs.length} dischi e sostituisce i ${state.discs.length} attuali.`, "Sostituisci", true))) return;
  applyImport(discs);
});
function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso)) / 86400000) : Infinity; }
function lastBackupText(){ const d = getMeta().lastBackupAt; if (!d) return "Non hai ancora fatto un backup."; const n = daysSince(d); return "Ultimo backup: " + (n === 0 ? "oggi" : n === 1 ? "ieri" : `${n} giorni fa`) + "."; }
function bannerHTML(){
  const m = getMeta(); if (!state.discs.length) return "";
  if (m.snoozeUntil && Date.now() < new Date(m.snoozeUntil)) return "";
  const due = m.lastBackupAt ? (m.lastChangeAt && new Date(m.lastChangeAt) > new Date(m.lastBackupAt) && daysSince(m.lastBackupAt) >= 30) : daysSince(m.firstSeenAt) >= 7;
  if (!due) return "";
  return `<div class="banner"><div><b>È ora di fare un backup</b><span>${m.lastBackupAt ? `L'ultimo è di ${daysSince(m.lastBackupAt)} giorni fa.` : "Non hai ancora salvato un backup."}</span></div><div class="banner-acts"><button class="btn ghost small" id="bkLater">Più tardi</button><button class="btn small" id="bkNow">Fai backup</button></div></div>`;
}
$("homeBanner").addEventListener("click", async e => {
  if (e.target.id === "bkLater"){ setMeta("snoozeUntil", new Date(Date.now() + 7 * 86400000).toISOString()); render(); }
  if (e.target.id === "bkNow"){ openMenu(); $("mOk").textContent = await exportBackup(); render(); }
});
function openMenu(msg){
  $("menu").innerHTML = `
    <h3>Menu</h3>
    <p>I dischi sono salvati su questo dispositivo e funzionano anche offline.</p>
    <button class="item" id="mExport">Esporta backup<small>${state.discs.length} dischi in un file .json · ${esc(lastBackupText())}</small></button>
    <button class="item" id="mImport">Importa backup<small>Sostituisce la collezione di questo dispositivo</small></button>
    <button class="item" id="mOffline">Salva le copertine per l'uso offline<small>${state.discs.filter(d => d.coverUrl && !d.coverLocal).length} copertine online · serve internet</small></button>
    <button class="item" id="mCsv">Esporta in Excel<small>File .csv con tutti i dischi, da aprire con Excel o Numbers</small></button>
    <div class="ok" id="mOk">${esc(msg || "")}</div><div class="err" id="mErr"></div>
    <div class="actions"><button class="btn ghost" id="mClose">Chiudi</button></div>
    <p style="text-align:center;font-size:12px;margin-top:14px">Versione ${APP_VERSION}</p>`;
  $("menuOv").hidden = false;
  $("mClose").onclick = () => { $("menuOv").hidden = true; };
  $("mExport").onclick = async () => { $("mOk").textContent = await exportBackup(); render(); };
  $("mImport").onclick = () => { $("importFile").value = ""; $("importFile").click(); };
  $("mCsv").onclick = async () => { $("mOk").textContent = await exportCSV(); };
  $("mOffline").onclick = async () => {
    if (!navigator.onLine){ $("mErr").textContent = "Serve la connessione a internet."; return; }
    const todo = state.discs.filter(d => d.coverUrl && !d.coverLocal);
    if (!todo.length){ $("mOk").textContent = "Non ci sono copertine da salvare."; return; }
    if (!(await askConfirm("Salvare le copertine?", `Scarico ${todo.length} copertine sul telefono, così le vedi anche senza internet. Ci vuole qualche minuto: tieni l'app aperta.`, "Scarica"))) return;
    let done = 0, ok = 0;
    $("mOffline").disabled = true;
    for (const d of todo){
      await new Promise(res => { const im = new Image(); const t = setTimeout(res, 8000); im.onload = () => { ok++; clearTimeout(t); res(); }; im.onerror = () => { clearTimeout(t); res(); }; im.src = d.coverUrl; });
      done++; $("mOk").textContent = `Copertine: ${done} di ${todo.length}…`;
    }
    $("mOk").textContent = `Fatto: ${ok} copertine salvate${ok < todo.length ? `, ${todo.length - ok} non raggiungibili` : ""}.`;
    $("mOffline").disabled = false;
  };
}
$("menuBtn").onclick = () => openMenu();
$("menuOv").addEventListener("click", e => { if (e.target.id === "menuOv") $("menuOv").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (!$("cfOv").hidden) return $("cfNo").click(); $("formOv").hidden = true; $("detOv").hidden = true; $("menuOv").hidden = true; } });

/* ---------- Avvio ---------- */
$("credits").innerHTML = `<b>I miei vinili</b><br>Versione ${APP_VERSION} · by Massimo Merigo`;
state.discs = load();
if (!getMeta().firstSeenAt) setMeta("firstSeenAt", new Date().toISOString());
showView((location.hash || "").slice(1), false);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
